    la degradación del descubrimiento de cuentas en Banco Solaris, que reduce en 18 % las altas de usuarios nuevos.</p>
    <h4>Detalle</h4>
    ${tabla}
    <h4>Recomendaciones</h4>
    <p>1. Escalar formalmente con Banco Solaris la degradación del core emisor; es la causa única del incumplimiento del objetivo de vinculación de cuentas.<br>
    2. Ampliar el pool de conexiones del directorio de alias antes de la hora punta del mediodía.<br>
    3. Evaluar ampliar la vigencia de la clave temporal de 90 a 120 segundos para reducir el abandono en la afiliación.</p>
    <p class="note" style="margin-top:22px">Documento generado automáticamente. Los nombres de participantes y operaciones son ficticios.</p>
  </div>`;
}

/* ---------------------------- 19. CAJÓN LATERAL ------------------------ */

const $=s=>document.querySelector(s);
function abrirCajon(titulo,sub,html){
  $('#dtitle').textContent=titulo; $('#dsub').textContent=sub;
  $('#dbody').innerHTML=html; $('#drawer').classList.add('on'); $('#scrim').classList.add('on');
  PEND.splice(0).forEach(f=>{try{f()}catch(e){}});
}
function cerrarCajon(){ $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); }

function abrirTxn(id){
  const t=txns().find(x=>x.id===id); if(!t) return;
  const {hops,total}=traza(t);
  abrirCajon('Operación '+t.id, t.o.proc+' · '+hhmm(t.t)+' · '+ddmm(t.t), `
    <div style="display:flex;gap:8px;flex-wrap:wrap">${pill(ESTSEV[t.est],ESTLBL[t.est])}
      <span class="chip">${t.op}</span><span class="chip">${MS(t.ms)}</span>
      ${t.monto?`<span class="chip">${S(t.monto)}</span>`:''}</div>
    ${t.motivo?`<div class="hint" style="border-color:${estado(ESTSEV[t.est])};background:transparent">
      <span>▲</span><div><b>Motivo:</b> ${esc(t.motivo)}${t.inc?` · Relacionado con el incidente <b>${t.inc.id}</b>`:''}</div></div>`:''}
    <section class="panel"><div class="ph"><h3>Recorrido de la operación</h3>
      <span class="sub">tiempo total ${MS(total)}</span></div>
      <div class="pb"><div class="trace">${hops.map(h=>`
        <div class="hop"><div class="who"><span class="dot" style="background:${estado(h.estado)}"></span><b>${esc(h.nom)}</b></div>
        <div class="track"><i style="left:${h.off}%;width:${Math.max(1.5,h.pct)}%;background:${estado(h.estado)}"></i></div>
        <span class="ms">${MS(h.ms)}</span></div>`).join('')}</div>
      <p class="note" style="margin-top:10px">Cada barra muestra cuándo participó el componente y cuánto tardó. ${
        t.inc?`El core de la entidad emisora consume el <b>${Math.round(hops.find(h=>h.nd==='iss').ms/total*100)} %</b> del tiempo total.`
             :'La distribución es la esperada para este tipo de operación.'}</p>
      </div></section>
    <section class="panel"><div class="ph"><h3>Datos de la operación</h3></div><div class="pb">
      <dl class="kv">
        <dt>Referencia</dt><dd>${t.id}</dd>
        <dt>Operación</dt><dd>${t.op}</dd>
        <dt>Proceso</dt><dd>${esc(t.o.proc)}</dd>
        <dt>Participante de origen</dt><dd>${esc(t.org.nom)} (${t.org.id})</dd>
        <dt>Participante de destino</dt><dd>${esc(t.dst.nom)} (${t.dst.id})</dd>
        <dt>Alias del beneficiario</dt><dd>${'*'.repeat(6)}${String(rint(t.id+'al',10,99))}@${t.dst.id.toLowerCase()}</dd>
        <dt>Importe</dt><dd>${t.monto?S2(t.monto):'no aplica'}</dd>
        <dt>Marca de tiempo</dt><dd>${ddmm(t.t)} ${hhmm(t.t)}:${String(t.t.getSeconds()).padStart(2,'0')}</dd>
        <dt>Canal</dt><dd>${pick(t.id+'c',['Aplicación móvil','Aplicación móvil','Banca por internet','Código QR presencial'])}</dd>
      </dl>
      <p class="note" style="margin-top:10px">Los identificadores personales aparecen enmascarados según la política de datos.</p>
    </div></section>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" onclick="aviso('Se abrió el caso de atención ${'CA'+rint(t.id,10000,99999)}')">Abrir caso de atención</button>
      <button class="btn" onclick="aviso('Operación marcada para revisión de conciliación')">Marcar para conciliación</button>
    </div>`);
}

function abrirAlerta(id){
  const a=incPorId(id); if(!a) return;
  const {pts}=rejilla(), L=pts.map(p=>p.lbl), c=SERIES();
  const s=pts.map((p,i)=> 100*(0.4+rr('ia'+i,0,.12)+2.2*enIncidente(p.t,a)));
  const b=chartBox();
  chTime(b.id,{series:[{nom:'Indicador de la alerta',color:estado(a.sev),data:s}],labels:L,area:true,h:150,bands:bandaInc(a),yFmt:v=>Math.round(v)});
  const afect = txns().filter(t=>t.inc&&t.inc.id===a.id).slice(0,6);
  abrirCajon(a.ttl, a.id+' · '+(a.estado==='resuelto'?'resuelta':'abierta desde ')+hhmm(a.desde), `
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${pill(a.sev)}
      <span class="chip">${a.op}</span><span class="chip">${a.ent?esc(ENT[a.ent].nom):'Toda la red'}</span>
      <span class="chip">${esc(NODOS[a.nodo].nom)}</span></div>
    <div class="hint"><span>▲</span><div><b>Impacto en el negocio.</b> ${esc(a.impacto)}</div></div>
    <div class="kpis" style="grid-template-columns:repeat(3,1fr)">
      ${a.kpi.map(k=>`<div class="kpi"><div class="k">${esc(k[0])}</div><div class="v" style="font-size:21px">${esc(k[1])}</div><div class="d">${esc(k[2])}</div></div>`).join('')}
    </div>
    <section class="panel"><div class="ph"><h3>Evolución</h3></div><div class="pb">${b.html}</div></section>
    <section class="panel"><div class="ph"><h3>Causa probable</h3></div><div class="pb">
      <p style="margin:0;font-size:13px;line-height:1.6">${esc(a.causa)}</p></div></section>
    <section class="panel"><div class="ph"><h3>Acciones</h3></div><div class="pb">
      <ul style="margin:0;padding-left:18px;font-size:12.5px;line-height:1.8">${a.acciones.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></section>
    ${afect.length?`<section class="panel"><div class="ph"><h3>Operaciones afectadas</h3><span class="sub">muestra</span></div>
      <div class="pb flush"><table class="tbl"><tbody>${afect.map(t=>`<tr class="clickable" onclick="abrirTxn('${t.id}')">
      <td class="mono">${hhmm(t.t)}</td><td class="mono">${t.id}</td><td>${esc(t.dst.nom)}</td>
      <td class="num">${MS(t.ms)}</td><td>${pill(ESTSEV[t.est],ESTLBL[t.est])}</td></tr>`).join('')}</tbody></table></div></section>`:''}
    ${a.estado==='abierto'?`<div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn pri" onclick="reconocer('${a.id}')">${ST.ack.has(a.id)?'Reconocida':'Reconocer y asignarme'}</button>
      <button class="btn" onclick="aviso('Se notificó a la mesa de servicio del participante')">Escalar al participante</button>
      <button class="btn" onclick="irA('${a.dash}');cerrarCajon()">Ir al panel relacionado</button></div>`:''}`);
}

function abrirNodo(k){
  const {pts}=rejilla(), L=pts.map(p=>p.lbl), c=SERIES();
  const carga={app:38,part:44,gw:56,core:62,dir:91,iss:96,sec:22}[k];
  const salud={app:'good',part:'good',gw:'good',core:'good',dir:'ser',iss:'crit',sec:'good'}[k];
  const lat=pts.map((p,i)=> ({app:40,part:70,gw:60,core:110,dir:150,iss:640,sec:120}[k])*rr('nl'+k+i,.85,1.2)*
    (1+(k==='iss'?5.4:k==='dir'?1.2:0)*enIncidente(p.t,k==='iss'?INCIDENTES[0]:INCIDENTES[1])));
  const b=chartBox();
  chTime(b.id,{series:[{nom:'Tiempo de respuesta',color:salud==='good'?c[0]:estado(salud),data:lat}],labels:L,area:true,h:150,tFmt:MS,yFmt:v=>Math.round(v)});
  const usadaPor = OPS.filter(o=>o.via.includes(k));
  abrirCajon(NODOS[k].nom, 'Componente de la cadena de servicio', `
    <div style="display:flex;gap:8px;flex-wrap:wrap">${pill(salud, salud==='good'?'Operativo':salud==='ser'?'Degradado':'Crítico')}
      <span class="chip">uso ${carga} %</span><span class="chip">${usadaPor.length} operaciones dependen de él</span></div>
    <section class="panel"><div class="ph"><h3>Tiempo de respuesta</h3></div><div class="pb">${b.html}</div></section>
    <section class="panel"><div class="ph"><h3>Operaciones que lo atraviesan</h3></div><div class="pb flush">
      <div class="scrolly"><table class="tbl"><thead><tr><th>Operación</th><th>Proceso</th><th class="num">Peso</th></tr></thead>
      <tbody>${usadaPor.sort((a,b)=>b.vol-a.vol).map(o=>`<tr><td class="mono">${o.id}</td><td>${esc(o.proc)}</td>
        <td class="num">${o.vol.toFixed(1).replace('.',',')}</td></tr>`).join('')}</tbody></table></div></div></section>
    <p class="note">Si este componente se detiene, las ${usadaPor.length} operaciones listadas dejan de funcionar. Es la base para calcular el impacto de una ventana de mantenimiento.</p>`);
}

function abrirOp(id){
  const o=OPBY[id]; if(!o) return;
  const {pts}=rejilla(), L=pts.map(p=>p.lbl), c=SERIES();
  const degr=id==='acct.discover';
  const vol=serie('op'+id,{base:o.vol*58,ruido:.15, inc:degr?INCIDENTES[0]:null, incMul:.6});
  const err=pts.map((p,i)=> o.err*rr('oe'+id+i,.85,1.15)*(1+(degr?4:0)*enIncidente(p.t,INCIDENTES[0])));
  const b1=chartBox(), b2=chartBox();
  chTime(b1.id,{series:[{nom:'Llamadas',color:c[0],data:vol}],labels:L,area:true,h:140});
  chTime(b2.id,{series:[{nom:'Tasa de error',color:c[7],data:err}],labels:L,area:true,h:140,yFmt:v=>v.toFixed(1)+' %',tFmt:v=>P(v)});
  abrirCajon(o.proc, id+' · grupo '+o.grp, `
    <div style="display:flex;gap:8px;flex-wrap:wrap"><span class="chip">${o.grp}</span>
      <span class="chip">panel: ${o.dash}</span><span class="chip">${o.via.length} componentes</span></div>
    <section class="panel"><div class="ph"><h3>Volumen</h3></div><div class="pb">${b1.html}</div></section>
    <section class="panel"><div class="ph"><h3>Tasa de error</h3></div><div class="pb">${b2.html}</div></section>
    <section class="panel"><div class="ph"><h3>Cadena de componentes</h3></div><div class="pb">
      <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">${o.via.map((n,i)=>
        `${i?'<span style="color:var(--ink-3)">→</span>':''}<span class="chip" style="cursor:pointer" onclick="abrirNodo('${n}')">${esc(NODOS[n].corto)}</span>`).join('')}</div>
      <p class="note" style="margin-top:10px">Latencia esperada: ${MS(o.lat)} · Tasa de error de referencia: ${P(o.err)}</p></div></section>`);
}

function abrirEntidad(id){
  const e=ENT[id]; const {pts}=rejilla(), L=pts.map(p=>p.lbl), c=SERIES();
  const v=serie('ent'+id,{base:1180*e.share,ruido:.12, inc:id==='SOL'?INCIDENTES[0]:null, incMul:.72});
  const b=chartBox(); chTime(b.id,{series:[{nom:'Operaciones',color:e.salud==='crit'?cssv('--crit'):c[0],data:v}],labels:L,area:true,h:150});
  abrirCajon(e.nom, e.tipo+' · participante '+e.id, `
    <div style="display:flex;gap:8px;flex-wrap:wrap">${pill(e.salud, e.salud==='good'?'Operativo':e.salud==='warn'?'Vigilar':'Degradado')}
      <span class="chip">${(e.share*100).toFixed(1).replace('.',',')} % de la red</span></div>
    <section class="panel"><div class="ph"><h3>Volumen de operaciones</h3></div><div class="pb">${b.html}</div></section>
    <div class="kpis" style="grid-template-columns:repeat(3,1fr)">
      ${kpi({k:'Éxito',v:P(id==='SOL'?97.94:99.42),d:null,nota:'periodo actual'})}
      ${kpi({k:'Tiempo medio',v:(id==='SOL'?3.4:1.8).toFixed(1).replace('.',',')+' s',d:null,nota:'de extremo a extremo'})}
      ${kpi({k:'Reclamos',v:String(rint('rc'+id,3,48)),d:null,nota:'abiertos'})}
    </div>
    ${id==='SOL'?`<div class="hint"><span>▲</span><div><b>Participante con incidente abierto.</b> ${esc(INCIDENTES[0].impacto)}
      <a class="btn sm" style="margin-left:6px" onclick="abrirAlerta('ALT-4417')">Ver alerta</a></div></div>`:''}`);
}
</script>

<script>
/* ------------------------ 20. NAVEGACIÓN Y ARRANQUE -------------------- */

const I = {
  panel:'<path d="M2 3h11v4H2zM2 9h5v4H2zM9 9h4v4H9z"/>',
  pago :'<path d="M1.5 4h12v2h-12zM1.5 8h12v3.5a.5.5 0 0 1-.5.5H2a.5.5 0 0 1-.5-.5zM3 10h3v1H3z"/>',
  user :'<circle cx="7.5" cy="4.5" r="2.5"/><path d="M2 13c0-3 2.5-4.5 5.5-4.5S13 10 13 13z"/>',
  cara :'<circle cx="7.5" cy="7.5" r="6" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="5.5" cy="6" r=".9"/><circle cx="9.5" cy="6" r=".9"/><path d="M4.6 9.4a3.6 3.6 0 0 0 5.8 0" fill="none" stroke="currentColor" stroke-width="1.3"/>',
  pulso:'<path d="M1 8h3l1.5-4 2.5 8L10 8h4" fill="none" stroke="currentColor" stroke-width="1.5"/>',
  libro:'<path d="M2 2.5h4.5c.6 0 1 .4 1 1V13c0-.6-.4-1-1-1H2zM13 2.5H8.5c-.6 0-1 .4-1 1V13c0-.6.4-1 1-1H13z"/>',
  llave:'<circle cx="5" cy="5" r="3.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7.3 7.3 13 13M10.4 10.4l1.4-1.4" stroke="currentColor" stroke-width="1.5" fill="none"/>',
  balan:'<path d="M7.5 2v11M4 13h7M2 6h11M4 6 2 10h4zM11 6l-2 4h4z" fill="none" stroke="currentColor" stroke-width="1.3"/>',
  alert:'<path d="M7.5 1 14 13H1z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6.9 5.5h1.2v3.5H6.9zM6.9 9.8h1.2V11H6.9"/>',
  meta :'<circle cx="7.5" cy="7.5" r="6" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="7.5" cy="7.5" r="3" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="7.5" cy="7.5" r=".9"/>',
  red  :'<circle cx="3" cy="7.5" r="2"/><circle cx="12" cy="3.5" r="2"/><circle cx="12" cy="11.5" r="2"/><path d="M4.7 6.6 10.3 4M4.7 8.4l5.6 2.6" stroke="currentColor" stroke-width="1.2"/>',
  lupa :'<circle cx="6.5" cy="6.5" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 10l3.5 3.5" stroke="currentColor" stroke-width="1.5"/>',
  doc  :'<path d="M3 1.5h6l3 3V13.5H3z" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5 7h5M5 9.5h5" stroke="currentColor" stroke-width="1.2"/>'
};
function ic(p){ return `<svg class="ic" viewBox="0 0 15 15" fill="currentColor" aria-hidden="true">${p}</svg>`; }

const VIEWS={
  general     :{t:'Vista general',        s:'lo esencial de la red en una pantalla', f:vGeneral,      i:I.panel, g:'Negocio'},
  pagos       :{t:'Pagos',                s:'volumen, monto y aceptación',           f:vPagos,        i:I.pago,  g:'Negocio'},
  onboarding  :{t:'Afiliación de usuarios',s:'del registro a la primera cuenta',     f:vOnboarding,   i:I.user,  g:'Negocio'},
  experiencia :{t:'Experiencia del usuario',s:'lo que siente quien usa la app',      f:vExperiencia,  i:I.cara,  g:'Negocio'},
  operacional :{t:'Operación de la red',  s:'carga, tiempos y errores',              f:vOperacional,  i:I.pulso, g:'Operación'},
  directorio  :{t:'Directorio de alias',  s:'resolución de celular y alias',         f:vDirectorio,   i:I.libro, g:'Operación'},
  seguridad   :{t:'Seguridad',            s:'claves, PIN y credenciales',            f:vSeguridad,    i:I.llave, g:'Operación'},
  conciliacion:{t:'Conciliación',         s:'cierre y liquidación de operaciones',   f:vConciliacion, i:I.balan, g:'Operación'},
  alertas     :{t:'Alertas',              s:'qué requiere atención ahora',           f:vAlertas,      i:I.alert, g:'Control'},
  slo         :{t:'Objetivos de servicio',s:'compromisos y presupuesto de error',    f:vSLO,          i:I.meta,  g:'Control'},
  mapa        :{t:'Cadena de servicio',   s:'componentes y participantes',           f:vMapa,         i:I.red,   g:'Control'},
  explorador  :{t:'Explorador de operaciones', s:'buscar una transacción concreta',  f:vExplorador,   i:I.lupa,  g:'Herramientas'},
  reportes    :{t:'Reportes',             s:'para dirección y para el regulador',    f:vReportes,     i:I.doc,   g:'Herramientas'}
};
const ALIAS={consultas:'operacional', admin:'directorio', qr:'pagos', cobros:'pagos', liquidacion:'conciliacion',
  enrutamiento:'mapa', vinculacion:'onboarding', 'atencion':'experiencia', reclamos:'experiencia',
  ecosistema:'mapa', disponibilidad:'operacional', 'directorio seguro':'directorio'};

function pintarNav(){
  const grupos=['Negocio','Operación','Control','Herramientas'];
  const n=incAbiertos().length;
  document.getElementById('nav').innerHTML = grupos.map(g=>`
    <div class="navgrp"><h4>${g}</h4><div class="nav">
      ${Object.entries(VIEWS).filter(([,v])=>v.g===g).map(([k,v])=>
        `<a data-v="${k}" class="${ST.vista===k?'on':''}">${ic(v.i)}<span>${esc(v.t)}</span>
          ${k==='alertas'&&n?`<span class="badge">${n}</span>`:''}</a>`).join('')}
    </div></div>`).join('');
  document.querySelectorAll('#nav a').forEach(a=>a.addEventListener('click',()=>irA(a.dataset.v)));
}

function irA(v){
  v = VIEWS[v] ? v : (ALIAS[v]||'general');
  ST.vista=v; location.hash=v; window.scrollTo(0,0); render(); pintarNav();
}

let RENDERIZANDO=false;
function render(mantenerScroll){
  if(RENDERIZANDO) return; RENDERIZANDO=true;
  const y = mantenerScroll ? window.scrollY : 0;
  const v = VIEWS[ST.vista]||VIEWS.general;
  document.getElementById('vt').textContent=v.t;
  document.getElementById('vs').textContent='· '+v.s;
  PEND.length=0;
  document.getElementById('view').innerHTML=v.f();
  requestAnimationFrame(()=>{
    PEND.splice(0).forEach(f=>{ try{f()}catch(e){console.warn('gráfico',e)} });
    if(mantenerScroll) window.scrollTo(0,y);
    RENDERIZANDO=false;
  });
}

/* avisos */
function aviso(txt){
  const w=document.getElementById('toasts');
  const d=document.createElement('div'); d.className='toast'; d.innerHTML='<span>✓</span><span>'+esc(txt)+'</span>';
  w.appendChild(d); setTimeout(()=>d.remove(),3600);
}
function reconocer(id){ ST.ack.add(id); aviso('Alerta '+id+' reconocida y asignada a tu usuario'); cerrarCajon(); pintarNav(); render(true); }
function reconocerTodas(){ INCIDENTES.filter(i=>i.estado==='abierto').forEach(i=>ST.ack.add(i.id));
  aviso('Todas las alertas quedaron reconocidas'); pintarNav(); render(true); }

/* controles de la barra superior */
document.getElementById('rangeseg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  ST.rango=b.dataset.r;
  document.querySelectorAll('#rangeseg button').forEach(x=>x.classList.toggle('on',x===b));
  render();
});
document.getElementById('livebtn').addEventListener('click',function(){
  ST.vivo=!ST.vivo; this.classList.toggle('on',ST.vivo); this.classList.toggle('off',!ST.vivo);
  document.getElementById('livetxt').textContent = ST.vivo?'En vivo':'Pausado';
  if(ST.vivo) aviso('Actualización automática reanudada');
});
document.getElementById('themebtn').addEventListener('click',()=>{
  const r=document.documentElement;
  const oscuroAhora = r.getAttribute('data-theme')==='dark' ||
    (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  r.setAttribute('data-theme', oscuroAhora?'light':'dark');
  render(true);
});
document.getElementById('dclose').addEventListener('click',cerrarCajon);
document.getElementById('scrim').addEventListener('click',cerrarCajon);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') cerrarCajon(); });

/* refresco en vivo y reajuste */
setInterval(()=>{
  if(!ST.vivo) return;
  if(document.getElementById('drawer').classList.contains('on')) return;
  if(ST.vista==='explorador'||ST.vista==='reportes') return;
  ST.tick++; render(true);
}, 4000);

let tRes;
addEventListener('resize',()=>{ clearTimeout(tRes); tRes=setTimeout(()=>render(true),180); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>render(true));

/* arranque */
(function(){
  const h=location.hash.replace('#','');
  if(VIEWS[h]) ST.vista=h;
  pintarNav(); render();
})();
</script>
