<meta charset="utf-8">
<title>Centro de Control Atalaya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: light;
  --ground:#eef1f4; --surface:#ffffff; --surface-2:#f6f8fa; --surface-3:#eceff3;
  --rail:#131a22; --rail-ink:#c8d2dc; --rail-ink-dim:#7b8896; --rail-line:#26303b;
  --ink:#0d141b; --ink-2:#4e5a66; --ink-3:#7d8894;
  --line:#dde3e9; --line-2:#c9d2da; --grid:#e6ebf0;
  --brand:#0a6e6a; --brand-soft:#e2f1f0; --brand-ink:#08514e;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-bg:#e6f5e6; --warn-bg:#fdf3dd; --serious-bg:#fceee7; --crit-bg:#fae7e7;
  --good-ink:#0a6b0a; --warn-ink:#8a5f00; --ser-ink:#a3502a; --crit-ink:#9c2626;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --ring:rgba(13,20,27,.10); --shadow:0 1px 2px rgba(13,20,27,.06), 0 8px 24px rgba(13,20,27,.08);
  --sim-ink:#8a5a00; --sim-bg:#ffefc9; --sim-line:#f0d089;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --cond:"IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#0f1419; --surface:#171d24; --surface-2:#1c232b; --surface-3:#222a34;
    --rail:#0b1015; --rail-ink:#b6c2ce; --rail-ink-dim:#6c7a88; --rail-line:#1d262f;
    --ink:#e9eef3; --ink-2:#a5b1bd; --ink-3:#7b8794;
    --line:#28313b; --line-2:#333e4a; --grid:#232c35;
    --brand:#40b8b0; --brand-soft:#12312f; --brand-ink:#7fd8d1;
    --good-bg:#122a12; --warn-bg:#332811; --serious-bg:#331f16; --crit-bg:#331616;
    --good-ink:#5ed35e; --warn-ink:#f8c96a; --ser-ink:#f0a482; --crit-ink:#ef7b7b;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --ring:rgba(255,255,255,.10); --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
    --sim-ink:#f6cf7a; --sim-bg:#33280f; --sim-line:#5a4718;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#0f1419; --surface:#171d24; --surface-2:#1c232b; --surface-3:#222a34;
  --rail:#0b1015; --rail-ink:#b6c2ce; --rail-ink-dim:#6c7a88; --rail-line:#1d262f;
  --ink:#e9eef3; --ink-2:#a5b1bd; --ink-3:#7b8794;
  --line:#28313b; --line-2:#333e4a; --grid:#232c35;
  --brand:#40b8b0; --brand-soft:#12312f; --brand-ink:#7fd8d1;
  --good-bg:#122a12; --warn-bg:#332811; --serious-bg:#331f16; --crit-bg:#331616;
  --good-ink:#5ed35e; --warn-ink:#f8c96a; --ser-ink:#f0a482; --crit-ink:#ef7b7b;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --ring:rgba(255,255,255,.10); --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
  --sim-ink:#f6cf7a; --sim-bg:#33280f; --sim-line:#5a4718;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

#app{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:15px 16px 13px;border-bottom:1px solid var(--rail-line)}
.brand .mk{width:26px;height:26px;flex:none}
.brand b{font-family:var(--cond);font-weight:700;font-size:16px;letter-spacing:.03em;color:#fff;display:block;line-height:1.15}
.brand span{font-family:var(--cond);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--rail-ink-dim)}
.navgrp{padding:13px 10px 0}
.navgrp>h4{font-family:var(--cond);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--rail-ink-dim);margin:0 0 6px 8px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:5px;color:var(--rail-ink);text-decoration:none;font-size:12.8px;cursor:pointer;border-left:2px solid transparent}
.nav a:hover{background:#1b242e}
.nav a.on{background:#1e2a33;color:#fff;border-left-color:var(--brand)}
.nav a .ic{width:15px;height:15px;flex:none;opacity:.8}
.nav a.on .ic{opacity:1}
.nav a .badge{margin-left:auto;font-family:var(--mono);font-size:10px;background:var(--crit);color:#fff;border-radius:9px;padding:0 6px;line-height:15px}
.railfoot{margin-top:auto;padding:12px 14px;border-top:1px solid var(--rail-line);font-size:10.5px;color:var(--rail-ink-dim);font-family:var(--cond);letter-spacing:.05em;line-height:1.6}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:9px;padding:0 18px;height:54px;background:var(--surface);border-bottom:1px solid var(--line)}
.crumb{display:flex;align-items:baseline;gap:9px;min-width:0}
.crumb h1{font-family:var(--cond);font-size:17px;font-weight:700;margin:0;letter-spacing:.01em;white-space:nowrap}
.crumb em{font-style:normal;color:var(--ink-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbspace{flex:1}
.sim{display:inline-flex;align-items:center;gap:6px;font-family:var(--cond);font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;color:var(--sim-ink);background:var(--sim-bg);border:1px solid var(--sim-line);padding:3px 8px;border-radius:4px}
.seg{display:inline-flex;background:var(--surface-3);border-radius:6px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;color:var(--ink-2);padding:4px 9px;border-radius:4px;font-size:12px;cursor:pointer;font-family:var(--mono)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.10);font-weight:500}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:5px 10px;border-radius:6px;font-size:12.5px;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
.btn.sm{padding:3px 8px;font-size:11.5px}
.live{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);cursor:pointer;border:1px solid var(--line-2);border-radius:6px;padding:4px 9px;background:var(--surface)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none}
.live.on .dot{animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.75)}}
.live.off .dot{background:var(--ink-3);animation:none}
select.sel{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:5px 8px;font-size:12.5px}

.content{padding:16px 18px 46px;display:flex;flex-direction:column;gap:14px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}
.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}
@media (max-width:1180px){.c3,.c4,.c5{grid-column:span 6}.c7,.c8,.c9{grid-column:span 12}}
@media (max-width:820px){#app{grid-template-columns:1fr}.rail{position:static;height:auto}.c3,.c4,.c5,.c6,.c7,.c8,.c9{grid-column:span 12}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-width:0}
.ph{display:flex;align-items:center;gap:10px;padding:11px 14px 9px;border-bottom:1px solid var(--line)}
.ph h3{margin:0;font-family:var(--cond);font-size:13.5px;font-weight:600;letter-spacing:.02em}
.ph .sub{font-size:11.5px;color:var(--ink-3)}
.ph .rt{margin-left:auto;display:flex;align-items:center;gap:8px}
.pb{padding:12px 14px 14px;min-width:0}
.pb.flush{padding:0}
.eyebrow{font-family:var(--cond);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

.kpis{background:var(--surface);border:1px solid var(--line);border-radius:8px;display:grid;grid-template-columns:repeat(5,1fr)}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{padding:12px 16px 13px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi:first-child{border-left:0}
.kpi .k{font-family:var(--cond);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.15;display:flex;align-items:baseline;gap:4px}
.kpi .v small{font-size:13px;font-weight:500;color:var(--ink-2)}
.kpi .d{font-family:var(--mono);font-size:11.5px;display:flex;align-items:center;gap:5px;color:var(--ink-3)}
.up{color:var(--good-ink)}.down{color:var(--crit-ink)}
.kpi .sparkwrap{margin-top:3px;height:24px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:20px;white-space:nowrap}
.pill svg{width:11px;height:11px;flex:none}
.p-good{color:var(--good-ink);background:var(--good-bg)}
.p-warn{color:var(--warn-ink);background:var(--warn-bg)}
.p-ser{color:var(--ser-ink);background:var(--serious-bg)}
.p-crit{color:var(--crit-ink);background:var(--crit-bg)}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:4px;background:var(--surface-3);color:var(--ink-2)}
.sev-bar{width:3px;border-radius:2px;align-self:stretch;flex:none}

.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-family:var(--cond);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--surface);z-index:1}
.tbl td{padding:7px 12px;border-bottom:1px solid var(--grid);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tbl .mono{font-family:var(--mono);font-size:11.5px}
.tbl tr.clickable{cursor:pointer}
.scrollx{overflow-x:auto}
.scrolly{max-height:420px;overflow-y:auto}

.meter{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;min-width:56px}
.meter i{display:block;height:100%;border-radius:3px;background:var(--brand)}
.rowmeter{display:flex;align-items:center;gap:9px}
.rowmeter .meter{flex:1}
.rowmeter b{font-family:var(--mono);font-weight:500;font-size:11.5px;min-width:46px;text-align:right;font-variant-numeric:tabular-nums}

.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 9px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2)}
.legend i{width:9px;height:9px;border-radius:2px;flex:none}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:6px;box-shadow:var(--shadow);padding:8px 10px;font-size:11.5px;min-width:132px;z-index:20;opacity:0;transition:opacity .08s}
.tip.on{opacity:1}
.tip .tt{font-family:var(--cond);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px;font-weight:600}
.tip .tr{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-top:3px}
.tip .tr span{display:inline-flex;align-items:center;gap:6px}
.tip .tr i{width:8px;height:8px;border-radius:2px;flex:none}
.tip .tr b{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}

.scrim{position:fixed;inset:0;background:rgba(9,14,19,.44);z-index:80;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(700px,95vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:90;transform:translateX(101%);transition:transform .22s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-family:var(--cond);font-size:16px;font-weight:700}
.dh .sub{font-size:11.5px;color:var(--ink-3);font-family:var(--mono)}
.db{overflow-y:auto;padding:14px 16px 30px;display:flex;flex-direction:column;gap:14px}
.xclose{margin-left:auto;border:0;background:var(--surface-3);width:26px;height:26px;border-radius:5px;cursor:pointer;color:var(--ink-2);font-size:15px;line-height:1}

.trace{display:flex;flex-direction:column;gap:1px}
.hop{display:grid;grid-template-columns:200px 1fr 62px;align-items:center;gap:10px;padding:5px 8px;border-radius:5px}
.hop:hover{background:var(--surface-2)}
.hop .who{display:flex;align-items:center;gap:7px;min-width:0}
.hop .who b{font-weight:500;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hop .track{position:relative;height:15px;background:var(--surface-3);border-radius:3px}
.hop .track i{position:absolute;top:0;height:15px;border-radius:3px;display:block}
.hop .ms{font-family:var(--mono);font-size:11.5px;text-align:right;font-variant-numeric:tabular-nums}

.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12.5px;margin:0}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;font-family:var(--mono);font-size:12px;word-break:break-word}
.note{font-size:11.5px;color:var(--ink-3);line-height:1.55}
.empty{padding:28px 14px;text-align:center;color:var(--ink-3);font-size:12.5px}
.toastwrap{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--rail);color:#eaf0f5;padding:9px 15px;border-radius:7px;font-size:12.5px;box-shadow:var(--shadow);display:flex;align-items:center;gap:9px;animation:rise .2s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.alertrow{display:flex;gap:11px;padding:11px 14px;border-bottom:1px solid var(--grid);cursor:pointer}
.alertrow:hover{background:var(--surface-2)}
.alertrow:last-child{border-bottom:0}
.alertrow .body{flex:1;min-width:0}
.alertrow .ttl{font-weight:600;font-size:13px;margin-bottom:2px}
.alertrow .meta{font-size:11.5px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:4px 12px}
.alertrow .impact{font-size:12px;color:var(--ink-2);margin-top:4px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.filters input[type=search]{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:5px 9px;font-size:12.5px;min-width:220px;font-family:var(--mono)}
.stat2{display:flex;flex-wrap:wrap;gap:16px 26px}
.stat2>div{display:flex;flex-direction:column;gap:1px}
.stat2 .k{font-family:var(--cond);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.stat2 .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.hint{background:var(--brand-soft);border:1px solid var(--brand);border-left-width:3px;border-radius:6px;padding:10px 13px;font-size:12.5px;display:flex;gap:10px;align-items:flex-start;line-height:1.5}
.hint b{font-weight:600}
.repdoc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:26px 30px;max-width:940px}
.repdoc h2{font-family:var(--cond);font-size:22px;margin:0 0 2px}
.repdoc h4{font-family:var(--cond);font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin:22px 0 8px}
.repdoc p{margin:6px 0;font-size:13px;line-height:1.6;max-width:66ch}
@media print{.rail,.topbar,.noprint{display:none !important}#app{grid-template-columns:1fr}body{background:#fff}.content{padding:0}}
</style>

<div id="app">
  <aside class="rail">
    <div class="brand">
      <svg class="mk" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 2.2 3.4 6.4v5.9c0 5 3.6 8.6 8.6 9.7 5-1.1 8.6-4.7 8.6-9.7V6.4L12 2.2Z" stroke="#40b8b0" stroke-width="1.5" fill="rgba(64,184,176,.14)"/>
        <circle cx="12" cy="11.6" r="2.5" stroke="#40b8b0" stroke-width="1.5"/>
        <path d="M12 6.2v2.6M12 14.4v2.8M6.9 11.6h2.4M14.7 11.6h2.4" stroke="#40b8b0" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <div><b>ATALAYA</b><span>Centro de control</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="railfoot">
      Entorno: Producción simulada<br>
      Red: 8 participantes · 27 operaciones
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="crumb"><h1 id="vt">Vista general</h1><em id="vs"></em></div>
      <div class="tbspace"></div>
      <span class="sim" title="Todos los datos, nombres de operaciones y participantes son ficticios">◆ Simulación</span>
      <div class="seg" id="rangeseg">
        <button data-r="1h">1 h</button><button data-r="6h">6 h</button>
        <button data-r="24h" class="on">24 h</button><button data-r="7d">7 d</button><button data-r="30d">30 d</button>
      </div>
      <button class="live on" id="livebtn" title="Actualización automática cada 4 s"><span class="dot"></span><span id="livetxt">En vivo</span></button>
      <button class="btn sm" id="themebtn" title="Cambiar tema" aria-label="Cambiar tema">◐</button>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dtitle">
  <div class="dh">
    <div style="min-width:0">
      <h2 id="dtitle">—</h2>
      <div class="sub" id="dsub"></div>
    </div>
    <button class="xclose" id="dclose" aria-label="Cerrar">✕</button>
  </div>
  <div class="db" id="dbody"></div>
</aside>
<div class="toastwrap" id="toasts"></div>

<script>
/* =========================================================================
   ATALAYA — simulador de plataforma de observabilidad de negocio
   Todos los datos son sintéticos. Nombres de operaciones, participantes y
   componentes son ficticios y no corresponden a ningún sistema real.
   ========================================================================= */

/* ---------------------------- 1. CATÁLOGO ------------------------------ */

const ENTIDADES = [
  {id:'AUR', nom:'Banco Aurora',     tipo:'Banco',      share:.215, salud:'good'},
  {id:'SOL', nom:'Banco Solaris',    tipo:'Banco',      share:.175, salud:'crit'},

const nfInt   = new Intl.NumberFormat('es-PE',{maximumFractionDigits:0});

const nfPen2  = new Intl.NumberFormat('es-PE',{style:'currency',currency:'PEN',minimumFractionDigits:2,maximumFractionDigits:2});

const S  = n => nfPen.format(Math.round(n));

const MS = n => n>=1000 ? (n/1000).toFixed(2).replace('.',',')+' s' : Math.round(n)+' ms';
function K(n){

  if(n>=1e3) return (n/1e3).toFixed(1).replace('.',',')+' k';
  return N(n);
}
const hhmm = d => String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
const ddmm = d => String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');

function hace(d){
  const m = Math.max(0,Math.round((Date.now()-d.getTime())/60000));
  if(m<1) return 'ahora'; if(m<60) return 'hace '+m+' min';
  const h=Math.floor(m/60); if(h<24) return 'hace '+h+' h '+(m%60?(m%60)+' min':'');
  return 'hace '+Math.floor(h/24)+' d';
}
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* PRNG determinista: la misma clave siempre da el mismo valor */
function hash(str){ let h=2166136261; for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);} return h>>>0; }
function rnd(key){ let a=hash(key); a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }
const rr  = (key,min,max)=> min+(max-min)*rnd(key);
const rint= (key,min,max)=> Math.floor(rr(key,min,max+1));
const pick= (key,arr)=> arr[Math.min(arr.length-1,Math.floor(rnd(key)*arr.length))];

/* Curva de actividad diaria: valle de madrugada, picos de mediodía y noche */
function curva(d){
  const h = d.getHours()+d.getMinutes()/60;
  const g = (c,w)=>Math.exp(-Math.pow((h-c)/w,2));
  const m = 0.16 + 0.34*g(9.3,2.1) + 0.62*g(12.9,2.6) + 0.86*g(19.4,2.9) + 0.20*g(22.5,1.6);
  const wd = d.getDay();
  return m * (wd===0?0.74:wd===6?0.88:1);
}

/* Rejilla temporal según el rango seleccionado */
const RANGOS = {
  '1h' :{n:60, stepMin:1,    fmt:hhmm, lbl:'última hora'},
  '6h' :{n:72, stepMin:5,    fmt:hhmm, lbl:'últimas 6 horas'},
  '24h':{n:96, stepMin:15,   fmt:hhmm, lbl:'últimas 24 horas'},
  '7d' :{n:84, stepMin:120,  fmt:d=>ddmm(d)+' '+hhmm(d), lbl:'últimos 7 días'},
  '30d':{n:30, stepMin:1440, fmt:ddmm, lbl:'últimos 30 días'}
};
const ST = { rango:'24h', vista:'general', vivo:true, tick:0, ack:new Set() };

function rejilla(){
  const r = RANGOS[ST.rango], out=[], now=Date.now();
  const ms = r.stepMin*60000, base = Math.floor(now/ms)*ms;
  for(let i=r.n-1;i>=0;i--){ const t=new Date(base-i*ms); out.push({t,lbl:r.fmt(t)}); }
  return {pts:out, stepMin:r.stepMin, horas:r.stepMin/60};
}

/* ¿Está el punto dentro de la ventana de un incidente? */
function enIncidente(t, inc){
  if(!inc) return 0;
  const fin = inc.hasta ? inc.hasta.getTime() : Date.now();
  if(t.getTime()<inc.desde.getTime()||t.getTime()>fin) return 0;
  const prog = (t.getTime()-inc.desde.getTime())/Math.max(1,fin-inc.desde.getTime());
  return Math.min(1, 0.35+0.65*prog);
}

/* Generador genérico de series */
function serie(clave, opt){
  const {pts,horas} = rejilla();
  const {base=100, ruido=0.12, diario=true, tend=0, inc=null, incMul=1, piso=0, entero=true} = opt||{};
  return pts.map((p,i)=>{
    const c = diario ? curva(p.t)/0.86 : 1;
    const n = 1 + (rnd(clave+'|'+p.t.getTime())-0.5)*2*ruido;
    const tr = 1 + tend*(i/pts.length);
    let v = base*horas*c*n*tr;
    const f = enIncidente(p.t, inc);
    if(f) v *= (1 + (incMul-1)*f);
    return Math.max(piso, entero?Math.round(v):v);
  });
}
function suma(a){ return a.reduce((x,y)=>x+y,0); }
function media(a){ return a.length? suma(a)/a.length : 0; }
function ultimo(a){ return a[a.length-1]||0; }
function delta(a){ const h=Math.floor(a.length/2); const p=media(a.slice(0,h)), q=media(a.slice(h));
  return p? (q-p)/p*100 : 0; }

/* Volumen total de la red por punto (transacciones de pago liquidadas) */
function volPagos(){ return serie('pagos', {base:1180, ruido:.10}); }
function volMontos(v){ return v.map((x,i)=> x * rr('tkt'+i, 96, 152)); }

function ticks(max,count){
  count=count||4;
  if(!(max>0)) return [0,1];
  const raw=max/count, mag=Math.pow(10,Math.floor(Math.log10(raw))), nm=raw/mag;
  const step=(nm<=1?1:nm<=2?2:nm<=2.5?2.5:nm<=5?5:10)*mag;
  const out=[]; for(let v=0; v<=max*1.0001; v+=step) out.push(+v.toFixed(6));
  out.push(+(out[out.length-1]+step).toFixed(6));
  return out;
}
function tipHTML(titulo,filas){
  return `<div class="tt">${esc(titulo)}</div>`+filas.map(f=>

      capas.push(capa);
      if(stack) acumPrev=arr;
    });
    g+=capas.join('');

    /* etiquetas del eje X */

}

/* ---- Barras verticales (simples o apiladas) ---- */
function chBars(id,cfg){
  PEND.push(()=>{
    const box=document.getElementById(id); if(!box) return;
    const W=Math.max(280,box.clientWidth), H=cfg.h||188;
    const pl=cfg.pl||52, pr=10, pt=12, pb=cfg.pb||24;
    const iw=W-pl-pr, ih=H-pt-pb, n=cfg.labels.length, S=cfg.series;
    const totales=new Array(n).fill(0); S.forEach(s=>s.data.forEach((v,i)=>totales[i]+=v));
    const tk=ticks(Math.max(...totales),4), ymax=tk[tk.length-1];
    const bw=Math.min(cfg.bw||34, iw/n*0.68), gap=iw/n;
    const Y=v=> pt+ih-(v/ymax)*ih;
    const gridc=cssv('--grid'), muted=cssv('--ink-3'), yf=cfg.yFmt||K;
    let g='';
    tk.forEach(v=>{const y=Y(v);
      g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="${gridc}"/>`;
      g+=`<text x="${pl-8}" y="${y+3.5}" text-anchor="end" font-size="10" font-family="var(--mono)" fill="${muted}">${yf(v)}</text>`;});
    for(let i=0;i<n;i++){
      const cxp=pl+gap*(i+.5), x=cxp-bw/2; let acc=0;
      S.forEach(s=>{
        const v=s.data[i]; if(v<=0) return;
        const y0=Y(acc+v), y1=Y(acc), h=Math.max(1,y1-y0-(acc>0?2:0));
        const top = (acc+v>=totales[i]-1e-9);
        g+=`<rect x="${x}" y="${y0}" width="${bw}" height="${h}" fill="${s.color}" ${top?'rx="4" ry="4"':''}/>`;
        if(top&&h>6) g+=`<rect x="${x}" y="${y0+h-5}" width="${bw}" height="5" fill="${s.color}"/>`;
        acc+=v;
      });
      g+=`<rect class="hit" data-i="${i}" x="${pl+gap*i}" y="${pt}" width="${gap}" height="${ih}" fill="transparent"/>`;
    }
    g+=`<line x1="${pl}" x2="${W-pr}" y1="${pt+ih}" y2="${pt+ih}" stroke="${cssv('--line-2')}"/>`;
    const paso=Math.max(1,Math.ceil(n/(W>720?12:6)));
    for(let i=0;i<n;i+=paso) g+=`<text x="${pl+gap*(i+.5)}" y="${H-7}" text-anchor="middle" font-size="10" font-family="var(--mono)" fill="${muted}">${esc(cfg.labels[i])}</text>`;
    box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(cfg.aria||'Barras')}">${g}</svg><div class="tip"></div>`;
    const tip=box.querySelector('.tip'), svg=box.querySelector('svg');
    box.querySelectorAll('.hit').forEach(h=>{
      h.addEventListener('mousemove',ev=>{
        const i=+h.dataset.i, r=svg.getBoundingClientRect(), sx=W/r.width;
        const filas=S.map(s=>({k:s.nom,c:s.color,v:(cfg.tFmt||yf)(s.data[i])}));
        if(S.length>1) filas.push({k:'Total',v:(cfg.tFmt||yf)(totales[i])});
        tip.innerHTML=tipHTML(cfg.labels[i],filas); tip.classList.add('on');
        anclarTip(box,tip,(pl+gap*(i+.5))/sx,ev.clientY-r.top);
      });
      h.addEventListener('mouseleave',()=>tip.classList.remove('on'));
    });
  });
}

/* ---- Barras horizontales con etiqueta directa ---- */
function chHBars(id,cfg){
  PEND.push(()=>{
    const box=document.getElementById(id); if(!box) return;
    const items=cfg.items, W=Math.max(260,box.clientWidth);
    const lw=cfg.lw||150, vw=cfg.vw||72, bh=cfg.bh||22, gap=cfg.gap||8;

    const max=Math.max(...items.map(i=>i.value))||1;
    const muted=cssv('--ink-3'), ink=cssv('--ink');
    const recorta=(s,px)=>{ const max=Math.floor(px/6.35); return s.length>max? s.slice(0,max-1)+'…' : s; };
    let g='';
    items.forEach((it,i)=>{
      const y=i*(bh+gap)+2, w=Math.max(2,(it.value/max)*iw);

      g+=`<rect x="${lw}" y="${y}" width="${iw}" height="${bh}" rx="3" fill="${cssv('--surface-3')}"/>`;

      if(it.sub && w < iw*0.66)
        g+=`<text x="${lw+w+7}" y="${y+bh/2+4}" font-size="10.5" font-family="var(--mono)" fill="${muted}">${esc(recorta(it.sub, iw-w-14))}</text>`;

/* ---- Anillo de tasa de éxito ---- */

      <text x="${cx}" y="${cy+21}" text-anchor="middle" font-size="10.5" fill="${cssv('--ink-3')}" font-family="var(--cond)" letter-spacing="1.2">${esc((cfg.sub||'').toUpperCase())}</text>

/* ---- Mapa de calor hora × dimensión ---- */
function chHeat(id,cfg){
  PEND.push(()=>{
    const box=document.getElementById(id); if(!box) return;
    const W=Math.max(300,box.clientWidth), lw=cfg.lw||132, cols=cfg.cols.length, rows=cfg.rows.length;
    const cw=Math.max(8,(W-lw-4)/cols), ch=cfg.ch||22, H=rows*(ch+2)+22;
    const max=cfg.max||Math.max(...cfg.values.flat())||1;
    const muted=cssv('--ink-3'), oscuro=document.documentElement.getAttribute('data-theme')==='dark'||
      (!document.documentElement.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);
    const esc9=['#cde2fb','#b7d3f6','#9ec5f4','#86b6ef','#6da7ec','#5598e7','#3987e5','#2a78d6','#256abf','#1c5cab','#184f95'];
    const escD=['#12304f','#16395e','#19426f','#1c4b80','#1f5490','#245ea1','#2a78d6','#3987e5','#5598e7','#6da7ec','#86b6ef'];
    const ramp=oscuro?escD:esc9;
    let g='';
    cfg.rows.forEach((rn,ri)=>{
      const y=ri*(ch+2)+18;
      g+=`<text x="0" y="${y+ch/2+4}" font-size="11.5" fill="${cssv('--ink')}">${esc(rn)}</text>`;
      cfg.cols.forEach((cn,ci)=>{
        const v=cfg.values[ri][ci], k=Math.min(ramp.length-1,Math.round(v/max*(ramp.length-1)));
        g+=`<rect class="hc" data-r="${ri}" data-c="${ci}" x="${lw+ci*cw}" y="${y}" width="${cw-2}" height="${ch}" rx="2" fill="${ramp[k]}"/>`;
      });
    });
    const paso=Math.max(1,Math.ceil(cols/(W>760?12:6)));
    for(let ci=0;ci<cols;ci+=paso) g+=`<text x="${lw+ci*cw+cw/2}" y="12" text-anchor="middle" font-size="10" font-family="var(--mono)" fill="${muted}">${esc(cfg.cols[ci])}</text>`;
    box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(cfg.aria||'Mapa de calor')}">${g}</svg><div class="tip"></div>`;
    const tip=box.querySelector('.tip'), svg=box.querySelector('svg');
    box.querySelectorAll('.hc').forEach(c=>{
      c.addEventListener('mousemove',ev=>{
        const ri=+c.dataset.r, ci=+c.dataset.c, r=svg.getBoundingClientRect();
        tip.innerHTML=tipHTML(cfg.rows[ri]+' · '+cfg.cols[ci],[{k:cfg.unidad||'Valor',v:(cfg.vFmt||K)(cfg.values[ri][ci])}]);
        tip.classList.add('on'); anclarTip(box,tip,ev.clientX-r.left,ev.clientY-r.top);
      });
      c.addEventListener('mouseleave',()=>tip.classList.remove('on'));
    });
  });
}

/* ---- Embudo de conversión ---- */
function chFunnel(id,cfg){
  PEND.push(()=>{
    const box=document.getElementById(id); if(!box) return;
    const W=Math.max(300,box.clientWidth), pasos=cfg.pasos, n=pasos.length;
    const fila=62, bh=22, H=n*fila;
    const max=pasos[0].v||1;
    const ink=cssv('--ink'), muted=cssv('--ink-3');
    const ramp=['#256abf','#2a78d6','#3987e5','#5598e7','#6da7ec','#86b6ef'];
    let g='';
    pasos.forEach((p,i)=>{
      const y=i*fila, w=Math.max(4,p.v/max*W);
      const sig = pasos[i+1], caida = sig? (p.v-sig.v)/p.v*100 : 0;
      g+=`<text x="0" y="${y+11}" font-size="12.5" fill="${ink}">${esc(p.n)}</text>`;
      g+=`<text x="${W}" y="${y+11}" text-anchor="end" font-size="11.5" font-family="var(--mono)" fill="${muted}">${N(p.v)} · ${(p.v/max*100).toFixed(1).replace('.',',')} %</text>`;
      g+=`<rect x="0" y="${y+18}" width="${W}" height="${bh}" rx="3" fill="${cssv('--surface-3')}"/>`;
      g+=`<rect x="0" y="${y+18}" width="${w}" height="${bh}" rx="4" fill="${ramp[Math.min(i,ramp.length-1)]}"/>`;
      if(sig){
        const col = caida>15?cssv('--crit'):caida>8?cssv('--serious'):muted;
        g+=`<text x="0" y="${y+53}" font-size="10.5" font-family="var(--mono)" fill="${col}">▼ ${caida.toFixed(1).replace('.',',')} % de abandono · ${N(p.v-sig.v)} personas</text>`;
      }
    });
    box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Embudo de conversión">${g}</svg>`;
  });
}

/* ---- Minigráfico en línea ---- */
function spark(vals,color,w,h){
  w=w||110; h=h||24;
  const mn=Math.min(...vals), mx=Math.max(...vals), rg=(mx-mn)||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-2-((v-mn)/rg)*(h-5)).toFixed(1)}`).join(' ');
  const last=vals[vals.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" aria-hidden="true">
    <polygon points="${pts} ${w},${h} 0,${h}" fill="${color}" opacity=".12"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/>
    <circle cx="${w}" cy="${(h-2-((last-mn)/rg)*(h-5)).toFixed(1)}" r="2.4" fill="${color}"/></svg>`;
}
function leyenda(series){
  return `<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.nom)}</span>`).join('')}</div>`;
}
</script>

<script>
/* ------------------ 4. PIEZAS DE INTERFAZ REUTILIZABLES ---------------- */

function panel(o){

  return `<section class="panel ${o.cls||'c6'}">
    <div class="ph"><h3>${esc(o.t)}</h3>${o.sub?`<span class="sub">${esc(o.sub)}</span>`:''}
      ${o.rt?`<div class="rt">${o.rt}</div>`:''}</div>
    <div class="pb ${o.flush?'flush':''}">${o.body}</div></section>`;
}


function kpi(o){
  const d = o.d===undefined?null:o.d;
  const bueno = o.inverso ? d<0 : d>0;
  const flecha = d===null?'':(d>0?'▲':d<0?'▼':'■');
  return `<div class="kpi">
    <div class="k">${esc(o.k)}</div>
    <div class="v">${o.v}${o.u?`<small>${esc(o.u)}</small>`:''}</div>
    <div class="d">${d===null?`<span>${esc(o.nota||'')}</span>`
      :`<span class="${bueno?'up':'down'}">${flecha} ${Math.abs(d).toFixed(1).replace('.',',')} %</span><span>${esc(o.nota||'vs. periodo previo')}</span>`}</div>
    ${o.spark?`<div class="sparkwrap">${o.spark}</div>`:''}</div>`;
}

const SEVLBL={crit:'Crítico',ser:'Grave',warn:'Atención',good:'Normal'};
const SEVCLS={crit:'p-crit',ser:'p-ser',warn:'p-warn',good:'p-good'};
const ICN={
  crit:'<svg viewBox="0 0 12 12" fill="currentColor"><path d="M6 0 12 11H0z"/><path d="M5.4 4h1.2v3.6H5.4zM5.4 8.4h1.2v1.2H5.4z" fill="#fff"/></svg>',
  ser :'<svg viewBox="0 0 12 12" fill="currentColor"><circle cx="6" cy="6" r="6"/><path d="M5.4 2.6h1.2v4H5.4zM5.4 7.6h1.2v1.4H5.4z" fill="#fff"/></svg>',
  warn:'<svg viewBox="0 0 12 12" fill="currentColor"><circle cx="6" cy="6" r="6"/><path d="M5.4 2.6h1.2v4H5.4zM5.4 7.6h1.2v1.4H5.4z" fill="#fff"/></svg>',
  good:'<svg viewBox="0 0 12 12" fill="currentColor"><circle cx="6" cy="6" r="6"/><path d="M3 6.2 5.1 8.3 9 4.4 8.1 3.5 5.1 6.5 3.9 5.3z" fill="#fff"/></svg>'};
function pill(sev,txt){ return `<span class="pill ${SEVCLS[sev]}">${ICN[sev]}${esc(txt||SEVLBL[sev])}</span>`; }

function bandaInc(inc){
  if(!inc) return [];
  const {pts}=rejilla(), fin=inc.hasta?inc.hasta.getTime():Date.now();
  let i0=-1,i1=-1;
  pts.forEach((p,i)=>{ const t=p.t.getTime(); if(t>=inc.desde.getTime()&&t<=fin){ if(i0<0)i0=i; i1=i; } });
  return i0<0?[]:[{from:i0,to:i1,color:estado(inc.sev)}];
}
const incPorId = id => INCIDENTES.find(i=>i.id===id);
const incAbiertos = () => INCIDENTES.filter(i=>i.estado==='abierto'&&!ST.ack.has(i.id));

/* --------------------- 5. TRANSACCIONES SIMULADAS ---------------------- */

const OPS_USUARIO=['pay.push','pay.push','pay.push','pay.collect','bal.query','alias.validate','qr.resolve','acct.discover','otp.issue','txn.history','alias.register','pin.update'];
const MOTIVOS=[['Fondos insuficientes',.34],['Cuenta de destino inactiva',.18],['Límite diario excedido',.14],['PIN incorrecto',.12],['Alias no encontrado',.10],['Tiempo de espera agotado',.08],['Rechazo de la entidad emisora',.04]];
function motivo(k){ const r=rnd(k); let a=0; for(const [m,p] of MOTIVOS){ a+=p; if(r<a) return m; } return MOTIVOS[0][0]; }
function entPorPeso(k){ const r=rnd(k); let a=0; for(const e of ENTIDADES){ a+=e.share; if(r<a) return e; } return ENTIDADES[0]; }

let TXNS=null;
function txns(){
  if(TXNS) return TXNS;
  const out=[], now=Date.now();
  for(let i=0;i<260;i++){
    const k='tx'+i;
    const t=new Date(now - Math.round(Math.pow(rnd(k+'t'),1.7)*7*3600*1000) - 4000);
    const op=pick(k+'o',OPS_USUARIO), o=OPBY[op];
    const org=entPorPeso(k+'a'); let dst=entPorPeso(k+'b');
    if(dst.id===org.id) dst=ENTIDADES[(ENTIDADES.indexOf(org)+3)%ENTIDADES.length];
    const inc = (op==='acct.discover'&&dst.id==='SOL'&&t>=INCIDENTES[0].desde) ? INCIDENTES[0] : null;
    const r=rnd(k+'s');
    let est = r<0.918?'exito' : r<0.972?'rechazado' : r<0.988?'proceso' : 'expirado';
    if(inc && rnd(k+'i')<0.42) est = rnd(k+'j')<0.7?'expirado':'rechazado';
    let ms = o.lat*rr(k+'l',0.65,2.4);
    if(inc) ms *= rr(k+'m',4.2,8.5);
    if(est==='expirado') ms = 5000+rr(k+'x',0,300);
    const monto = op==='pay.push'||op==='pay.collect' ? Math.round(rr(k+'v',6,2)*0+Math.exp(rr(k+'w',2.6,7.4))) : 0;
    out.push({id:'TX'+String(97314000+i*37).slice(0,9), t, op, o, org, dst, est, ms:Math.round(ms),
      monto:Math.min(monto,18500), motivo: est==='rechazado'?motivo(k+'r'):(est==='expirado'?'Tiempo de espera agotado':''), inc});
  }
  out.sort((a,b)=>b.t-a.t);
  TXNS=out; return out;
}
function traza(tx){
  const via=tx.o.via, hops=[], k=tx.id;
  let acum=0;
  via.forEach((nd,i)=>{
    let peso = nd==='iss'?0.42 : nd==='dir'?0.30 : nd==='core'?0.18 : nd==='gw'?0.14 : nd==='sec'?0.16 : 0.10;
    let ms = tx.ms*peso*rr(k+'h'+i,0.7,1.35);
    if(tx.inc && nd==='iss') ms = tx.ms*0.86;
    hops.push({nd, nom:NODOS[nd].nom, ms:Math.round(ms), ini:acum});
    acum += ms*0.72;
  });
  const total = hops.reduce((a,h)=>Math.max(a,h.ini+h.ms),0);
  hops.forEach(h=>{ h.pct=h.ms/total*100; h.off=h.ini/total*100;
    h.estado = tx.inc&&h.nd==='iss' ? 'crit' : h.ms>1500?'ser' : h.ms>700?'warn':'good'; });
  return {hops,total};
}

/* -------------------------- 6. VISTA GENERAL --------------------------- */

function vGeneral(){
  const {pts}=rejilla(), L=pts.map(p=>p.lbl);
  const push  = serie('v.push',   {base:640, ruido:.10});
  const qr    = serie('v.qr',     {base:310, ruido:.13});
  const cobro = serie('v.cobro',  {base:118, ruido:.16});
  const total = push.map((v,i)=>v+qr[i]+cobro[i]);
  const monto = total.map((v,i)=> v*rr('tk'+i,102,148));
  const usuarios = serie('v.usr', {base:520, ruido:.09});
  const exito = pts.map((p,i)=> 99.62 - (enIncidente(p.t,INCIDENTES[0])?rr('e'+i,.35,.9):0) - rr('n'+i,0,.12));
  const totHoy = suma(total), monHoy = suma(monto);
  const c=SERIES();
  const abiertos = incAbiertos();
  const critico = abiertos.find(a=>a.sev==='crit');

  const ranking = ENTIDADES.map((e,i)=>({label:e.nom, value:Math.round(totHoy*e.share*rr('rk'+e.id,.93,1.07)),
      color:e.salud==='crit'?cssv('--crit'):e.salud==='warn'?cssv('--warn'):c[0], sub:e.salud==='crit'?'degradado':''}))
    .sort((a,b)=>b.value-a.value);

  const procesos=[
    {n:'Pago inmediato entre personas', op:'pay.push',   vol:suma(push)},
    {n:'Pago con código QR',            op:'qr.resolve', vol:suma(qr)},
    {n:'Solicitud de cobro',            op:'pay.collect',vol:suma(cobro)},
    {n:'Consulta de saldo',             op:'bal.query',  vol:Math.round(totHoy*0.58)},
    {n:'Alta de usuario nuevo',         op:'dev.enroll', vol:Math.round(totHoy*0.031)},
    {n:'Vinculación de cuenta',         op:'acct.discover',vol:Math.round(totHoy*0.038)}
  ].map(p=>{
    const o=OPBY[p.op];
    const degr = p.op==='acct.discover';
    const ex = 100-o.err*(degr?4.1:1)*rr('ex'+p.op,.85,1.15);
    const lat = o.lat*(degr?5.4:1)*rr('la'+p.op,.9,1.1);
    const sp = serie('sp'+p.op,{base:p.vol/24,ruido:.2, inc: degr?INCIDENTES[0]:null, incMul:.55});
    return {...p, ex, lat, sp, sev: ex<95?'crit':ex<98.5?'warn':'good'};
  });

  return `
  ${critico?`<div class="hint"><span style="font-size:15px;line-height:1">▲</span><div>
    <b>Hay un incidente crítico en curso.</b> ${esc(critico.impacto)}
    <a class="btn sm" style="margin-left:8px" onclick="abrirAlerta('${critico.id}')">Ver detalle</a></div></div>`:''}

  <div class="kpis">
    ${kpi({k:'Transacciones', v:K(totHoy), d:delta(total), spark:spark(total,c[0]), nota:'vs. mitad previa'})}
    ${kpi({k:'Monto movilizado', v:S(monHoy).replace(/\s/g,' '), d:delta(monto), spark:spark(monto,c[2])})}
    ${kpi({k:'Tasa de éxito', v:P(media(exito)), d:delta(exito), spark:spark(exito,c[5])})}
    ${kpi({k:'Usuarios activos', v:K(suma(usuarios)), d:delta(usuarios), spark:spark(usuarios,c[6])})}
    ${kpi({k:'Ticket promedio', v:S2(monHoy/totHoy), d:0.8, spark:spark(monto.map((m,i)=>m/total[i]),c[3])})}
  </div>

  <div class="grid">
    ${(()=>{ const b=chartBox(); const S=[
        {nom:'Pago inmediato',color:c[0],data:push},
        {nom:'Pago con QR',   color:c[2],data:qr},
        {nom:'Solicitud de cobro',color:c[3],data:cobro}];
      chTime(b.id,{series:S,labels:L,stacked:true,h:212,bands:bandaInc(INCIDENTES[0]),aria:'Transacciones por canal'});
      return panel({cls:'c8',t:'Transacciones por canal', sub:RANGOS[ST.rango].lbl,
        rt:`<span class="chip">franja de ${RANGOS[ST.rango].stepMin} min</span>`,
        body: leyenda(S)+b.html+`<p class="note" style="margin:8px 0 0">La franja sombreada marca la ventana del incidente <b>${INCIDENTES[0].id}</b> en Banco Solaris.</p>`});})()}

    ${(()=>{ const b=chartBox();
      chDonut(b.id,{value:media(exito),sub:'operaciones completadas',h:150});
      const rech=100-media(exito);
      return panel({cls:'c4',t:'Salud del servicio al usuario',
        body:b.html+`<div class="stat2" style="margin-top:10px">
          <div><span class="k">No completadas</span><span class="v">${K(totHoy*rech/100)}</span></div>
          <div><span class="k">Objetivo del mes</span><span class="v">99,50 %</span></div>
          <div><span class="k">Tiempo medio de pago</span><span class="v">1,9 s</span></div>
        </div>`});})()}

    ${(()=>{ const b=chartBox();
      chBars(b.id,{series:[{nom:'Monto',color:c[2],data:monto}],labels:L,h:180,yFmt:v=>K(v),tFmt:S,aria:'Monto por franja'});
      return panel({cls:'c8',t:'Monto movilizado', sub:'soles por franja', body:b.html});})()}

    ${(()=>{ const b=chartBox();
      chHBars(b.id,{items:ranking,lw:132,vw:64,bh:20,gap:7,vFmt:v=>K(v)});
      return panel({cls:'c4',t:'Participantes por volumen', sub:'origen de la operación',
        body:b.html+`<p class="note" style="margin-top:10px">Banco Solaris aparece en rojo por el incidente en curso; su volumen ya cayó 12 % respecto de su media.</p>`});})()}

    ${panel({cls:'c12',t:'Procesos de negocio', sub:'estado y volumen de cada proceso que ve el usuario', flush:true,
      body:`<div class="scrollx"><table class="tbl">
        <thead><tr><th>Proceso</th><th>Operación</th><th class="num">Volumen</th><th class="num">Éxito</th><th class="num">Tiempo típico</th><th style="width:130px">Tendencia</th><th>Estado</th></tr></thead>
        <tbody>${procesos.map(p=>`<tr class="clickable" onclick="irA('${OPBY[p.op].dash}')">
          <td>${esc(p.n)}</td><td class="mono">${p.op}</td>
          <td class="num">${K(p.vol)}</td><td class="num">${P(p.ex)}</td><td class="num">${MS(p.lat)}</td>
          <td>${spark(p.sp, p.sev==='crit'?cssv('--crit'):cssv('--s1'),110,22)}</td>
          <td>${pill(p.sev, p.sev==='good'?'Normal':p.sev==='warn'?'Vigilar':'Degradado')}</td></tr>`).join('')}
        </tbody></table></div>`})}

    ${panel({cls:'c12',t:'Alertas activas', sub:incAbiertos().length+' sin atender', flush:true,
      rt:`<button class="btn sm" onclick="irA('alertas')">Ver todas</button>`,
      body: listaAlertas(incAbiertos().slice(0,4))})}
  </div>`;
}

function listaAlertas(arr){
  if(!arr.length) return `<div class="empty">No hay alertas activas. La red opera dentro de los umbrales acordados.</div>`;
  return arr.map(a=>`<div class="alertrow" onclick="abrirAlerta('${a.id}')">
    <div class="sev-bar" style="background:${estado(a.sev)}"></div>
    <div class="body">
      <div class="ttl">${esc(a.ttl)}</div>
      <div class="meta"><span class="mono">${a.id}</span><span>${esc(a.op)}</span>
        <span>${a.ent?esc(ENT[a.ent].nom):'Toda la red'}</span><span>Desde ${hhmm(a.desde)} · ${hace(a.desde)}</span></div>
      <div class="impact">${esc(a.impacto)}</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">${pill(a.sev)}
      <span class="chip">${esc(a.estado==='resuelto'?'Resuelto':'Abierto')}</span></div>
  </div>`).join('');
}
</script>

<script>
/* ------------------------- 7. VISTA OPERACIONAL ------------------------ */

function muestra(arr,n){ if(arr.length<=n) return arr.slice();
  const out=[],p=arr.length/n; for(let i=0;i<n;i++) out.push(arr[Math.floor(i*p)]); return out; }

function vOperacional(){
  const {pts,horas}=rejilla(), L=pts.map(p=>p.lbl), c=SERIES();
  const tps  = pts.map((p,i)=> 21*curva(p.t)/0.86*rr('tps'+i,.9,1.1));
  const p50  = pts.map((p,i)=> 210*rr('a'+i,.92,1.08)*(1+.5*curva(p.t)));
  const p95  = pts.map((p,i)=> p50[i]*rr('b'+i,2.1,2.7)*(1+1.9*enIncidente(p.t,INCIDENTES[0])));
  const p99  = pts.map((p,i)=> p95[i]*rr('c'+i,1.5,1.9));
  const tout = serie('tout',{base:11,ruido:.4,inc:INCIDENTES[0],incMul:9});
  const errs = serie('errs',{base:96,ruido:.25,inc:INCIDENTES[0],incMul:3.1});
  const dispo = 99.982;

  const porOp = OPS.map(o=>{
    const degr = o.id==='acct.discover', tmo = o.id==='alias.validate';
    const vol = Math.round(o.vol*1400*horas*pts.length/24*rr('vo'+o.id,.9,1.1));
    const er  = o.err*(degr?4.6:tmo?2.1:1)*rr('er'+o.id,.85,1.15);
    const lat = o.lat*(degr?5.9:tmo?1.4:1)*rr('lt'+o.id,.9,1.1);
    return {o, vol, er, lat, p95:lat*2.4, sev: er>6?'crit':er>3.4?'ser':er>2.2?'warn':'good'};
  }).sort((a,b)=> (b.er*Math.log10(b.vol+10)) - (a.er*Math.log10(a.vol+10)));

  const comps=['app','part','gw','core','dir','iss','sec'];
  const colsH=muestra(pts,24);
  const valores = comps.map(cn=> colsH.map((p,i)=>{
    const base = {app:38,part:44,gw:56,core:62,dir:58,iss:66,sec:22}[cn];
    let v = base*curva(p.t)/0.7*rr('sat'+cn+i,.9,1.1);
    if(cn==='iss') v *= 1+1.05*enIncidente(p.t,INCIDENTES[0]);
    if(cn==='dir') v *= 1+0.55*enIncidente(p.t,INCIDENTES[1]);
    return Math.min(100,Math.round(v));
  }));

  const latidos = ENTIDADES.map(e=>{
    const perd = e.id==='SOL'?rint('hb'+e.id,4,11): e.id==='AND'?rint('hb'+e.id,1,3):0;
    return {e, perd, rtt: 28+rr('rtt'+e.id,0,70)+(e.id==='SOL'?260:0),
      up: 100-perd*0.06, sev: perd>6?'crit':perd>0?'warn':'good'};
  });

  return `
  <div class="kpis">
    ${kpi({k:'Operaciones por segundo', v:ultimo(tps).toFixed(1).replace('.',','), d:delta(tps), spark:spark(tps,c[0]), nota:'ahora mismo'})}
    ${kpi({k:'Latencia p95', v:MS(media(p95)), d:delta(p95), inverso:true, spark:spark(p95,c[1])})}
    ${kpi({k:'Esperas agotadas', v:N(suma(tout)), d:delta(tout), inverso:true, spark:spark(tout,c[7])})}
    ${kpi({k:'Errores', v:N(suma(errs)), d:delta(errs), inverso:true, spark:spark(errs,c[3])})}
    ${kpi({k:'Disponibilidad', v:P(dispo,3), d:null, nota:'objetivo 99,95 % · cumplido'})}
  </div>
  <div class="grid">
    ${(()=>{const b=chartBox(); const S=[{nom:'Operaciones por segundo',color:c[0],data:tps}];
      chTime(b.id,{series:S,labels:L,area:true,h:190,yFmt:v=>v.toFixed(0),tFmt:v=>v.toFixed(1).replace('.',',')+' op/s',bands:bandaInc(INCIDENTES[0])});
      return panel({cls:'c6',t:'Carga de la red', sub:'operaciones por segundo', body:b.html});})()}

    ${(()=>{const b=chartBox(); const S=[
        {nom:'Mediana (p50)',color:c[0],data:p50},{nom:'p95',color:c[3],data:p95},{nom:'p99',color:c[1],data:p99}];
      chTime(b.id,{series:S,labels:L,h:190,yFmt:v=>v>=1000?(v/1000).toFixed(1)+' s':Math.round(v)+' ms',tFmt:MS,bands:bandaInc(INCIDENTES[0])});
      return panel({cls:'c6',t:'Tiempos de respuesta', sub:'extremo a extremo', body:leyenda(S)+b.html});})()}

    ${(()=>{const b=chartBox();
      chBars(b.id,{series:[{nom:'Errores',color:c[7],data:errs},{nom:'Esperas agotadas',color:c[3],data:tout}],labels:L,h:178});
      return panel({cls:'c6',t:'Errores y esperas agotadas', sub:'por franja',
        body:leyenda([{nom:'Errores',color:c[7]},{nom:'Esperas agotadas',color:c[3]}])+b.html});})()}

    ${(()=>{const b=chartBox();
      chHeat(b.id,{rows:comps.map(x=>NODOS[x].nom),cols:colsH.map(p=>p.lbl),values:valores,max:100,lw:158,ch:20,unidad:'Uso de capacidad',vFmt:v=>v+' %'});
      return panel({cls:'c6',t:'Uso de capacidad por componente', sub:'porcentaje sobre el máximo dimensionado',
        body:b.html+`<p class="note" style="margin-top:8px">El core de la entidad emisora supera el 90 % desde las ${hhmm(INCIDENTES[0].desde)}; es la causa raíz del incidente ${INCIDENTES[0].id}.</p>`});})()}

    ${panel({cls:'c7',t:'Operaciones con más impacto', sub:'ordenadas por volumen afectado', flush:true,
      body:`<div class="scrollx scrolly"><table class="tbl">
        <thead><tr><th>Operación</th><th>Proceso</th><th class="num">Llamadas</th><th class="num">Error</th><th class="num">p95</th><th>Estado</th></tr></thead>
        <tbody>${porOp.slice(0,14).map(r=>`<tr class="clickable" onclick="abrirOp('${r.o.id}')">
          <td class="mono">${r.o.id}</td><td>${esc(r.o.proc)}</td>
          <td class="num">${K(r.vol)}</td><td class="num">${P(r.er)}</td><td class="num">${MS(r.p95)}</td>
          <td>${pill(r.sev)}</td></tr>`).join('')}</tbody></table></div>`})}

    ${panel({cls:'c5',t:'Conectividad con participantes', sub:'latido cada 30 s', flush:true,
      body:`<div class="scrollx"><table class="tbl">
        <thead><tr><th>Participante</th><th class="num">Latidos perdidos</th><th class="num">Ida y vuelta</th><th style="width:110px">Enlace</th></tr></thead>
        <tbody>${latidos.map(l=>`<tr><td>${esc(l.e.nom)}</td>
          <td class="num">${l.perd}</td><td class="num">${Math.round(l.rtt)} ms</td>
          <td><div class="rowmeter"><div class="meter"><i style="width:${l.up}%;background:${estado(l.sev)}"></i></div><b>${l.up.toFixed(1).replace('.',',')}%</b></div></td></tr>`).join('')}
        </tbody></table></div>`})}
  </div>`;
}

/* -------------------------- 8. VISTA ONBOARDING ------------------------ */

function vOnboarding(){
  const {pts}=rejilla(), L=pts.map(p=>p.lbl), c=SERIES();
  const inicio = serie('on.ini',{base:96,ruido:.15});
  const base = suma(inicio);
  const f = [
    {n:'Inició el registro en la app',        r:1.000},
    {n:'Dispositivo registrado',              r:0.941},
    {n:'Celular verificado por mensaje',      r:0.868},
    {n:'Alias creado y disponible',           r:0.832},
    {n:'Cuentas descubiertas en su banco',    r:0.694},
    {n:'Cuenta vinculada y PIN creado',       r:0.612}
  ].map(s=>({n:s.n, v:Math.round(base*s.r)}));
  const altas   = serie('on.alta',{base:59,ruido:.16, inc:INCIDENTES[0], incMul:.62});
  const abandon = inicio.map((v,i)=>v-altas[i]);
  const bind    = pts.map((p,i)=> 92.4 - rr('bd'+i,0,2.2));
  const sms     = serie('on.sms',{base:88,ruido:.14});
  const smsFail = sms.map((v,i)=> Math.round(v*rr('sf'+i,.02,.06)));

  const porSO=[{label:'Android 13+',value:.44},{label:'Android 10–12',value:.27},{label:'iOS 16+',value:.19},{label:'iOS 14–15',value:.07},{label:'Otros',value:.03}]
    .map((x,i)=>({label:x.label,value:Math.round(base*x.value),color:c[0],
      sub:i===1?'tasa de fallo 4,8 %':i===3?'tasa de fallo 6,1 %':''}));

  const porEnt = ENTIDADES.map(e=>{
    const degr=e.id==='SOL';
    const alt=Math.round(base*e.share*rr('oe'+e.id,.9,1.1)*(degr?.62:1));
    const conv=(degr?41.2:rr('cv'+e.id,58,71));
    return {e,alt,conv,sev:conv<50?'crit':conv<58?'warn':'good'};
  }).sort((a,b)=>b.alt-a.alt);

  return `
  <div class="hint"><span style="font-size:15px;line-height:1">▲</span><div>
    <b>La caída de altas viene de un solo participante.</b> El descubrimiento de cuentas en Banco Solaris está degradado desde las ${hhmm(INCIDENTES[0].desde)};
    el paso «Cuentas descubiertas» concentra el ${'16,6'} % de abandono, casi el doble de lo habitual.
    <a class="btn sm" style="margin-left:8px" onclick="abrirAlerta('ALT-4417')">Ver incidente</a></div></div>
  <div class="kpis">
    ${kpi({k:'Registros iniciados', v:K(base), d:delta(inicio), spark:spark(inicio,c[0])})}
    ${kpi({k:'Usuarios activados', v:K(suma(altas)), d:delta(altas), spark:spark(altas,c[2])})}
    ${kpi({k:'Conversión total', v:P(suma(altas)/base*100,1), d:-6.4, spark:spark(altas.map((v,i)=>v/inicio[i]*100),c[3])})}
    ${kpi({k:'Vinculación de dispositivo', v:P(media(bind),1), d:-0.4, spark:spark(bind,c[6])})}
    ${kpi({k:'Mensajes de verificación', v:K(suma(sms)), d:delta(sms), nota:N(suma(smsFail))+' no entregados'})}
  </div>
  <div class="grid">
    ${(()=>{const b=chartBox(); chFunnel(b.id,{pasos:f});
      return panel({cls:'c7',t:'Recorrido del usuario nuevo', sub:'de la descarga a la primera cuenta lista',
        body:b.html+`<p class="note" style="margin-top:12px">De cada 100 personas que inician el registro, <b>${(f[5].v/f[0].v*100).toFixed(0)}</b> terminan con una cuenta lista para pagar. El salto más caro está entre el alias creado y el descubrimiento de cuentas.</p>`});})()}

    ${(()=>{const b=chartBox(); const S=[{nom:'Activados',color:c[2],data:altas},{nom:'Abandonaron',color:c[1],data:abandon}];
      chBars(b.id,{series:S,labels:L,h:200});
      return panel({cls:'c5',t:'Altas frente a abandonos', sub:'por franja', body:leyenda(S)+b.html});})()}

    ${(()=>{const b=chartBox(); chHBars(b.id,{items:porSO,lw:130,vw:60,bh:20,gap:8});
      return panel({cls:'c5',t:'Registros por sistema operativo', sub:'y dónde fallan',
        body:b.html+`<p class="note" style="margin-top:10px">Las versiones antiguas de iOS concentran el mayor fallo de registro de dispositivo. Vale la pena revisar el mínimo soportado.</p>`});})()}

    ${panel({cls:'c7',t:'Conversión por participante', sub:'porcentaje que llega a tener cuenta lista', flush:true,
      body:`<div class="scrollx"><table class="tbl">
        <thead><tr><th>Participante</th><th>Tipo</th><th class="num">Altas</th><th style="width:150px">Conversión</th><th>Estado</th></tr></thead>
        <tbody>${porEnt.map(r=>`<tr><td>${esc(r.e.nom)}</td><td>${esc(r.e.tipo)}</td>
          <td class="num">${N(r.alt)}</td>
          <td><div class="rowmeter"><div class="meter"><i style="width:${r.conv}%;background:${estado(r.sev)}"></i></div><b>${r.conv.toFixed(1).replace('.',',')}%</b></div></td>
          <td>${pill(r.sev, r.sev==='good'?'Normal':r.sev==='warn'?'Bajo la media':'Degradado')}</td></tr>`).join('')}
        </tbody></table></div>`})}
  </div>`;
}

/* -------------------------- 9. VISTA DIRECTORIO ------------------------ */

function vDirectorio(){
  const {pts}=rejilla(), L=pts.map(p=>p.lbl), c=SERIES();
  const consultas = serie('dir.q',{base:1420,ruido:.11});
  const altas     = serie('dir.a',{base:62,ruido:.18});
  const cambios   = serie('dir.c',{base:19,ruido:.25});
  const bajas     = serie('dir.b',{base:11,ruido:.3});
  const resol     = pts.map((p,i)=> 148*rr('dr'+i,.9,1.15)*(1+1.4*enIncidente(p.t,INCIDENTES[1])));
  const toRate    = pts.map((p,i)=> 0.42*rr('dt'+i,.8,1.2)+ 2.1*enIncidente(p.t,INCIDENTES[1]));
  const dup       = serie('dir.d',{base:3.1,ruido:.5});

  const motivosFallo=[
    {label:'Alias no registrado',      value:4820, color:c[0]},
    {label:'Alias dado de baja',       value:1930, color:c[0]},
    {label:'Espera agotada',           value:1712, color:cssv('--serious'), sub:'incidente ALT-4418'},
    {label:'Formato de alias inválido',value:1104, color:c[0]},
    {label:'Alias bloqueado',          value: 402, color:c[0]}
  ];

  return `
  <div class="kpis">
    ${kpi({k:'Consultas de alias', v:K(suma(consultas)), d:delta(consultas), spark:spark(consultas,c[0])})}
    ${kpi({k:'Altas de alias', v:N(suma(altas)), d:delta(altas), spark:spark(altas,c[2])})}
    ${kpi({k:'Cambios y bajas', v:N(suma(cambios)+suma(bajas)), d:delta(cambios), inverso:true, spark:spark(cambios,c[3])})}
    ${kpi({k:'Tiempo de resolución', v:MS(media(resol)), d:delta(resol), inverso:true, spark:spark(resol,c[1])})}
    ${kpi({k:'Esperas agotadas', v:P(media(toRate)), d:delta(toRate), inverso:true, spark:spark(toRate,c[7])})}
  </div>
  <div class="grid">
    ${(()=>{const b=chartBox();
      chTime(b.id,{series:[{nom:'Consultas de alias',color:c[0],data:consultas}],labels:L,area:true,h:190,bands:bandaInc(INCIDENTES[1])});
      return panel({cls:'c7',t:'Consultas al directorio de alias', sub:'resolución celular ↔ alias',
        body:b.html+`<p class="note" style="margin-top:8px">El directorio resuelve ${K(suma(consultas))} consultas en ${RANGOS[ST.rango].lbl}. Es el componente más solicitado de toda la red.</p>`});})()}

    ${(()=>{const b=chartBox(); const S=[{nom:'Altas',color:c[2],data:altas},{nom:'Cambios',color:c[3],data:cambios},{nom:'Bajas',color:c[1],data:bajas}];
      chBars(b.id,{series:S,labels:L,h:190});
      return panel({cls:'c5',t:'Movimientos del directorio', sub:'altas, cambios y bajas', body:leyenda(S)+b.html});})()}

    ${(()=>{const b=chartBox();
      chTime(b.id,{series:[{nom:'Tiempo de resolución',color:c[1],data:resol}],labels:L,h:180,yFmt:v=>Math.round(v)+' ms',tFmt:MS,bands:bandaInc(INCIDENTES[1])});
      return panel({cls:'c6',t:'Tiempo de resolución de alias', sub:'mediana por franja',
        rt:pill('ser','Sobre el umbral'),
        body:b.html+`<p class="note" style="margin-top:8px">Umbral acordado: 250 ms. Se supera durante la ventana del incidente ${INCIDENTES[1].id}.</p>`});})()}

    ${(()=>{const b=chartBox(); chHBars(b.id,{items:motivosFallo,lw:170,vw:64,bh:20,gap:8});
      return panel({cls:'c6',t:'Por qué falla una resolución', sub:'motivos agrupados',
        body:b.html+`<p class="note" style="margin-top:10px">Solo el tercer motivo es un problema de la plataforma; los demás son situaciones esperadas del usuario y no cuentan contra el objetivo de servicio.</p>`});})()}

    ${panel({cls:'c12',t:'Entradas verificadas y duplicados', sub:'higiene del directorio',
      body:`<div class="stat2">
        <div><span class="k">Alias activos</span><span class="v">${N(4128900)}</span></div>
        <div><span class="k">Entradas verificadas</span><span class="v">${N(38214)}</span></div>
        <div><span class="k">Duplicados detectados hoy</span><span class="v">${N(suma(dup))}</span></div>
        <div><span class="k">Alias por usuario</span><span class="v">1,27</span></div>
        <div><span class="k">Alias sin uso en 90 días</span><span class="v">${N(206540)}</span></div>
        <div><span class="k">Cobertura de la población bancarizada</span><span class="v">63,4 %</span></div>
      </div>
      <p class="note" style="margin-top:12px">Hay ${N(206540)} alias sin actividad en 90 días. Depurarlos reduciría el tamaño del índice y el tiempo de resolución en la hora punta.</p>`})}
  </div>`;
}
</script>

<script>
/* ------------------------- 10. VISTA SEGURIDAD ------------------------- */

function vSeguridad(){
  const {pts}=rejilla(), L=pts.map(p=>p.lbl), c=SERIES();
  const otp     = serie('sg.otp',{base:104,ruido:.13});
  const otpExp  = otp.map((v,i)=> Math.round(v*(0.031+0.048*enIncidente(pts[i].t,INCIDENTES[3]))*rr('oe'+i,.8,1.2)));
  const otpFail = otp.map((v,i)=> Math.round(v*0.019*rr('of'+i,.7,1.3)));
  const pinNew  = serie('sg.pin',{base:58,ruido:.16});
  const pinChg  = serie('sg.pch',{base:14,ruido:.28});
  const pinBad  = serie('sg.pbd',{base:23,ruido:.35});
  const bloq    = serie('sg.blq',{base:2.1,ruido:.6});
  const llaves  = serie('sg.key',{base:41,ruido:.2,diario:false});

  const eventos = [
    {h:hoyA(15,42), t:'Rotación programada de llaves de cifrado', d:'Nuevo juego distribuido a 8 participantes. Sin interrupción.', s:'good'},
    {h:hoyA(15,10), t:'Bloqueo por intentos de PIN', d:'34 cuentas bloqueadas en la última hora, dentro del rango normal.', s:'good'},
    {h:hoyA(14,28), t:'Pico de claves temporales expiradas', d:'Caja Andina: 6,4 % de expiración frente al 3,3 % habitual.', s:'warn'},
    {h:hoyA(13,55), t:'Intentos desde dispositivo no vinculado', d:'112 intentos rechazados correctamente por la validación de dispositivo.', s:'good'},

    {h:hoyA(9,30),  t:'Revisión de entradas verificadas', d:'42 entradas revalidadas; 2 revocadas por inconsistencia de titularidad.', s:'good'}
  ];

  const porEnt = ENTIDADES.map(e=>{
    const mal = e.id==='AND';
    return {e, otp:Math.round(suma(otp)*e.share*rr('se'+e.id,.9,1.1)),
      exp: mal?6.4:rr('sx'+e.id,2.1,4.0), blk: rint('sb'+e.id,2,26),

    ${kpi({k:'PIN creados', v:N(suma(pinNew)), d:delta(pinNew), spark:spark(pinNew,c[2])})}
    ${kpi({k:'Intentos de PIN inválidos', v:N(suma(pinBad)), d:delta(pinBad), inverso:true, spark:spark(pinBad,c[7])})}
    ${kpi({k:'Cuentas bloqueadas', v:N(suma(bloq)), d:delta(bloq), inverso:true, nota:'desbloqueo automático a las 24 h'})}
  </div>
  <div class="grid">
    ${(()=>{const b=chartBox(); const S=[
        {nom:'Usadas a tiempo',color:c[2],data:otp.map((v,i)=>v-otpExp[i]-otpFail[i])},
        {nom:'Expiradas',color:c[3],data:otpExp},
        {nom:'Fallidas',color:c[7],data:otpFail}];
      chBars(b.id,{series:S,labels:L,h:200});
      return panel({cls:'c7',t:'Claves temporales de verificación', sub:'lo que pasa con cada clave enviada',
        rt:pill('warn','Expiración alta en un participante'),
        body:leyenda(S)+b.html+`<p class="note" style="margin-top:8px">Una clave expirada obliga al usuario a pedir otra: es el motivo más frecuente de abandono en la afiliación. Vigencia actual: 90 s.</p>`});})()}

    ${(()=>{const b=chartBox(); const S=[{nom:'PIN creados',color:c[2],data:pinNew},{nom:'Cambios de PIN',color:c[0],data:pinChg},{nom:'Intentos inválidos',color:c[7],data:pinBad}];
      chTime(b.id,{series:S,labels:L,h:200});
      return panel({cls:'c5',t:'Gestión del PIN transaccional', body:leyenda(S)+b.html});})()}

    ${panel({cls:'c7',t:'Claves temporales por participante', sub:'y su tasa de expiración', flush:true,
      body:`<div class="scrollx"><table class="tbl">
        <thead><tr><th>Participante</th><th class="num">Emitidas</th><th style="width:150px">Expiración</th><th class="num">Bloqueos</th><th>Estado</th></tr></thead>
        <tbody>${porEnt.map(r=>`<tr><td>${esc(r.e.nom)}</td><td class="num">${N(r.otp)}</td>
          <td><div class="rowmeter"><div class="meter"><i style="width:${Math.min(100,r.exp*10)}%;background:${estado(r.sev)}"></i></div><b>${r.exp.toFixed(1).replace('.',',')}%</b></div></td>
          <td class="num">${r.blk}</td><td>${pill(r.sev, r.sev==='good'?'Normal':'Sobre la media')}</td></tr>`).join('')}
        </tbody></table></div>`})}

    ${panel({cls:'c5',t:'Bitácora de seguridad', sub:'últimas horas', flush:true,
      body: eventos.map(e=>`<div class="alertrow" style="cursor:default">
        <div class="sev-bar" style="background:${estado(e.s)}"></div>
        <div class="body"><div class="ttl" style="font-size:12.5px">${esc(e.t)}</div>
        <div class="impact">${esc(e.d)}</div></div>
        <span class="chip">${hhmm(e.h)}</span></div>`).join('')})}

    ${panel({cls:'c12',t:'Credenciales y llaves', sub:'distribución y vigencia',
      body:`<div class="stat2">
        <div><span class="k">Entregas de llaves</span><span class="v">${N(suma(llaves))}</span></div>
        <div><span class="k">Última rotación</span><span class="v">${hhmm(hoyA(15,42))}</span></div>
        <div><span class="k">Próxima rotación</span><span class="v">en 6 días</span></div>
        <div><span class="k">Certificados vigentes</span><span class="v">8 de 8</span></div>
        <div><span class="k">Vence primero</span><span class="v">21 días</span></div>
        <div><span class="k">Fallos de firma</span><span class="v">0</span></div>
      </div>`})}
  </div>`;
}

/* --------------------------- 11. VISTA PAGOS --------------------------- */

function vPagos(){
  const {pts}=rejilla(), L=pts.map(p=>p.lbl), c=SERIES();
  const push  = serie('pg.push',{base:640,ruido:.10});
  const pull  = serie('pg.pull',{base:118,ruido:.16});
  const monto = push.map((v,i)=> (v+pull[i])*rr('pm'+i,102,148));
  const rech  = push.map((v,i)=> Math.round((v+pull[i])*rr('pr'+i,.014,.022)));
  const rev   = serie('pg.rev',{base:2.6,ruido:.5});
  const tmed  = pts.map((p,i)=> 1.72*rr('pt'+i,.88,1.2)*(1+.25*curva(p.t)));
  const tot   = suma(push)+suma(pull);

  const motivosR = MOTIVOS.map(([m,p],i)=>({label:m, value:Math.round(suma(rech)*p*rr('mr'+i,.9,1.1)),
    color: m==='Tiempo de espera agotado'?cssv('--serious'):c[0],
    sub: m==='Tiempo de espera agotado'?'atribuible a la plataforma':''}));

  const cobros = {enviadas:Math.round(suma(pull)*1.42), aceptadas:suma(pull),
    rechazadas:Math.round(suma(pull)*0.21), expiradas:Math.round(suma(pull)*0.21)};

  const pares = ENTIDADES.slice(0,6).map(e=>({e,
    env:Math.round(tot*e.share*rr('pe'+e.id,.9,1.1)),
    rec:Math.round(tot*e.share*rr('pf'+e.id,.85,1.2)),
    ex: e.id==='SOL'?97.9:rr('px'+e.id,98.9,99.8),
    t: e.id==='SOL'?3.4:rr('pl'+e.id,1.4,2.3)}));

  return `
  <div class="kpis">
    ${kpi({k:'Pagos completados', v:K(tot), d:delta(push), spark:spark(push,c[0])})}
    ${kpi({k:'Monto', v:S(suma(monto)), d:delta(monto), spark:spark(monto,c[2])})}
    ${kpi({k:'Tiempo medio de pago', v:tmed[tmed.length-1].toFixed(2).replace('.',',')+' s', d:delta(tmed), inverso:true, spark:spark(tmed,c[3])})}
    ${kpi({k:'Pagos rechazados', v:N(suma(rech)), d:delta(rech), inverso:true, spark:spark(rech,c[7])})}
    ${kpi({k:'Reversos', v:N(suma(rev)), d:delta(rev), inverso:true, nota:'devueltos en menos de 5 min'})}
  </div>
  <div class="grid">
    ${(()=>{const b=chartBox(); const S=[{nom:'Envío directo',color:c[0],data:push},{nom:'Solicitud de cobro',color:c[3],data:pull}];
      chTime(b.id,{series:S,labels:L,stacked:true,h:200});
      return panel({cls:'c8',t:'Pagos por modalidad', sub:'quién inicia la operación', body:leyenda(S)+b.html});})()}

    ${(()=>{const b=chartBox(); chDonut(b.id,{value:100-suma(rech)/tot*100, sub:'pagos aceptados', h:148});
      return panel({cls:'c4',t:'Aceptación de pagos',
        body:b.html+`<div class="stat2" style="margin-top:8px">
        <div><span class="k">Presupuesto de error</span><span class="v">78 %</span></div>
        <div><span class="k">Consumido</span><span class="v">del mes</span></div></div>
        <div class="meter" style="margin-top:8px;height:8px"><i style="width:78%;background:${cssv('--warn')}"></i></div>
        <p class="note" style="margin-top:8px">Al ritmo actual, el objetivo mensual de 99,5 % se incumpliría el día 24.</p>`});})()}

    ${(()=>{const b=chartBox(); chHBars(b.id,{items:motivosR,lw:180,vw:62,bh:20,gap:8});
      return panel({cls:'c6',t:'Por qué se rechaza un pago', sub:'motivo declarado al usuario',
        body:b.html+`<p class="note" style="margin-top:10px">Seis de cada siete rechazos son decisiones legítimas de la entidad emisora. Solo «tiempo de espera agotado» es responsabilidad de la plataforma.</p>`});})()}

    ${(()=>{const b=chartBox();
      chTime(b.id,{series:[{nom:'Tiempo medio de pago',color:c[3],data:tmed}],labels:L,area:true,h:180,
        yFmt:v=>v.toFixed(1).replace('.',',')+' s', tFmt:v=>v.toFixed(2).replace('.',',')+' s'});
      return panel({cls:'c6',t:'Cuánto tarda un pago', sub:'desde que el usuario confirma hasta el aviso al beneficiario',
        rt:`<span class="chip">compromiso: 5 s</span>`, body:b.html});})()}

    ${panel({cls:'c5',t:'Solicitudes de cobro', sub:'flujo de la modalidad de cobro',
      body:`<div class="stat2">
        <div><span class="k">Enviadas</span><span class="v">${N(cobros.enviadas)}</span></div>
        <div><span class="k">Aceptadas</span><span class="v">${N(cobros.aceptadas)}</span></div>
        <div><span class="k">Rechazadas</span><span class="v">${N(cobros.rechazadas)}</span></div>
        <div><span class="k">Expiradas sin respuesta</span><span class="v">${N(cobros.expiradas)}</span></div>
      </div>
      <div class="rowmeter" style="margin-top:14px"><div class="meter" style="height:8px">
        <i style="width:${cobros.aceptadas/cobros.enviadas*100}%;background:${cssv('--s2')}"></i></div>
        <b>${(cobros.aceptadas/cobros.enviadas*100).toFixed(0)}%</b></div>
      <p class="note" style="margin-top:10px">Tasa de aceptación de cobros. El cobro expira a las 12 horas si el pagador no responde.</p>`})}

    ${panel({cls:'c7',t:'Flujo entre participantes', sub:'envíos y recepciones', flush:true,
      body:`<div class="scrollx"><table class="tbl">
        <thead><tr><th>Participante</th><th class="num">Enviados</th><th class="num">Recibidos</th><th class="num">Saldo neto</th><th class="num">Éxito</th><th class="num">Tiempo</th></tr></thead>
        <tbody>${pares.map(r=>`<tr><td>${esc(r.e.nom)}</td>
          <td class="num">${K(r.env)}</td><td class="num">${K(r.rec)}</td>
          <td class="num" style="color:${r.rec-r.env>0?cssv('--good-ink'):cssv('--ink-2')}">${r.rec-r.env>0?'+':''}${K(r.rec-r.env)}</td>
          <td class="num">${P(r.ex)}</td><td class="num">${r.t.toFixed(1).replace('.',',')} s</td></tr>`).join('')}
        </tbody></table></div>`})}
  </div>`;
}

/* ------------------------ 12. VISTA CONCILIACIÓN ----------------------- */

function vConciliacion(){
  const {pts}=rejilla(), L=pts.map(p=>p.lbl), c=SERIES();
  const conf   = serie('cn.cf',{base:742,ruido:.10});
  const pend   = pts.map((p,i)=> Math.round(conf[i]*rr('cp'+i,.004,.011)*(1+3*enIncidente(p.t,INCIDENTES[0]))));
  const dif    = serie('cn.df',{base:1.4,ruido:.7});
  const consul = serie('cn.cs',{base:96,ruido:.2});
  const pendTot=suma(pend);

  const partidas = Array.from({length:9},(_,i)=>{
    const k='pt'+i, e1=entPorPeso(k+'a'); let e2=entPorPeso(k+'b'); if(e2.id===e1.id) e2=ENTIDADES[(i+4)%8];
    const est=pick(k+'e',['Pendiente de confirmación','Pendiente de confirmación','Diferencia de importe','Sin respuesta del emisor','Duplicado sospechoso']);
    return {id:'CN'+String(48210+i*13), e1, e2, monto:Math.round(Math.exp(rr(k+'m',4.2,8.1))),
      est, edad: rint(k+'h',6,290), sev: est==='Diferencia de importe'?'crit':est==='Duplicado sospechoso'?'ser':'warn'};
  }).sort((a,b)=>b.edad-a.edad);

  return `
  <div class="kpis">
    ${kpi({k:'Confirmaciones', v:K(suma(conf)), d:delta(conf), spark:spark(conf,c[0])})}
    ${kpi({k:'Pendientes de conciliar', v:N(pendTot), d:delta(pend), inverso:true, spark:spark(pend,c[3])})}
    ${kpi({k:'Diferencias abiertas', v:N(suma(dif)), d:delta(dif), inverso:true, nota:'requieren revisión manual'})}
    ${kpi({k:'Consultas de estado', v:K(suma(consul)), d:delta(consul), spark:spark(consul,c[6])})}
    ${kpi({k:'Conciliado automático', v:P(100-pendTot/suma(conf)*100,2), d:null, nota:'sin intervención humana'})}
  </div>
  <div class="grid">
    ${(()=>{const b=chartBox(); const S=[{nom:'Confirmadas',color:c[0],data:conf.map((v,i)=>v-pend[i])},{nom:'Pendientes',color:c[3],data:pend}];
      chBars(b.id,{series:S,labels:L,h:200});
      return panel({cls:'c8',t:'Cierre de operaciones por franja', sub:'confirmadas frente a pendientes',
        body:leyenda(S)+b.html+`<p class="note" style="margin-top:8px">Las pendientes se multiplican por cuatro durante la ventana del incidente en Banco Solaris: la operación sale del origen pero no recibe confirmación del destino.</p>`});})()}

    ${panel({cls:'c4',t:'Ventana de liquidación', sub:'ciclo actual',
      body:`<div class="stat2">
        <div><span class="k">Ciclo</span><span class="v">4 de 6</span></div>
        <div><span class="k">Cierra a las</span><span class="v">18:00</span></div>
        <div><span class="k">Importe neto</span><span class="v">${S(18420900)}</span></div>
        <div><span class="k">Partidas en el ciclo</span><span class="v">${N(suma(conf))}</span></div>
      </div>
      <div style="margin-top:14px" class="rowmeter"><div class="meter" style="height:8px"><i style="width:64%"></i></div><b>64%</b></div>
      <p class="note" style="margin-top:8px">Avance del ciclo de liquidación en curso. Ninguna partida excede la ventana de 24 horas acordada.</p>`})}

    ${panel({cls:'c12',t:'Partidas que requieren atención', sub:'ordenadas por antigüedad', flush:true,
      rt:`<button class="btn sm" onclick="aviso('Se exportaron ${partidas.length} partidas al formato de conciliación')">Exportar</button>`,
      body:`<div class="scrollx"><table class="tbl">
        <thead><tr><th>Referencia</th><th>Origen</th><th>Destino</th><th class="num">Importe</th><th>Situación</th><th class="num">Antigüedad</th><th>Prioridad</th></tr></thead>
        <tbody>${partidas.map(p=>`<tr><td class="mono">${p.id}</td><td>${esc(p.e1.nom)}</td><td>${esc(p.e2.nom)}</td>
          <td class="num">${S(p.monto)}</td><td>${esc(p.est)}</td>
          <td class="num">${p.edad>60?Math.round(p.edad/60)+' h':p.edad+' min'}</td>
          <td>${pill(p.sev, p.sev==='crit'?'Alta':p.sev==='ser'?'Media':'Normal')}</td></tr>`).join('')}
        </tbody></table></div>`})}
  </div>`;
}

/* ------------------------ 13. VISTA EXPERIENCIA ------------------------ */

function vExperiencia(){
  const {pts}=rejilla(), L=pts.map(p=>p.lbl), c=SERIES();
  const e2e   = pts.map((p,i)=> 2.1*rr('ee'+i,.9,1.15)*(1+.22*curva(p.t))*(1+.9*enIncidente(p.t,INCIDENTES[0])));
  const errApp= serie('ux.err',{base:34,ruido:.3,inc:INCIDENTES[0],incMul:2.6});
  const aband = pts.map((p,i)=> 4.2*rr('ab'+i,.85,1.2)+6.1*enIncidente(p.t,INCIDENTES[0]));
  const reclam= serie('ux.rc',{base:6.2,ruido:.4});
  const hist  = serie('ux.hs',{base:210,ruido:.15});

  const pasos=[
    {n:'Abrir la app',                 t:0.42, ab:1.1},
    {n:'Elegir contacto o escanear QR',t:0.88, ab:3.4},
    {n:'Validar al beneficiario',      t:0.31, ab:2.3, sev:'ser'},
    {n:'Ingresar monto',               t:0.24, ab:1.8},
    {n:'Confirmar con PIN',            t:0.63, ab:2.9},
    {n:'Recibir confirmación',         t:1.94, ab:0.4}
  ];
  const causasRec=[
    {label:'No recibí el dinero',        value:412, color:c[0]},
    {label:'Cobro duplicado',            value:186, color:c[0]},
    {label:'Pago a alias equivocado',    value:154, color:c[0]},
    {label:'La app se quedó cargando',   value:131, color:cssv('--serious'), sub:'relacionado con el incidente'},
    {label:'No pude afiliar mi cuenta',  value: 98, color:cssv('--serious')}
  ];

  return `
  <div class="kpis">
    ${kpi({k:'Tiempo extremo a extremo', v:media(e2e).toFixed(2).replace('.',',')+' s', d:delta(e2e), inverso:true, spark:spark(e2e,c[0])})}
    ${kpi({k:'Errores vistos por el usuario', v:N(suma(errApp)), d:delta(errApp), inverso:true, spark:spark(errApp,c[7])})}
    ${kpi({k:'Abandono de procesos', v:P(media(aband),1), d:delta(aband), inverso:true, spark:spark(aband,c[3])})}
    ${kpi({k:'Reclamos registrados', v:N(suma(reclam)), d:delta(reclam), inverso:true, spark:spark(reclam,c[1])})}
    ${kpi({k:'Consultas de historial', v:K(suma(hist)), d:delta(hist), nota:'uso de autoservicio'})}
  </div>
  <div class="grid">
    ${(()=>{const b=chartBox();
      chTime(b.id,{series:[{nom:'Tiempo extremo a extremo',color:c[0],data:e2e}],labels:L,area:true,h:190,
        yFmt:v=>v.toFixed(1).replace('.',',')+' s',tFmt:v=>v.toFixed(2).replace('.',',')+' s',bands:bandaInc(INCIDENTES[0])});
      return panel({cls:'c7',t:'Lo que espera el usuario', sub:'tiempo total percibido, incluida la app',
        body:b.html+`<p class="note" style="margin-top:8px">Por encima de 3 segundos el usuario empieza a tocar de nuevo el botón. En la ventana del incidente se superan los 4 segundos.</p>`});})()}

    ${panel({cls:'c5',t:'Dónde se cae el pago', sub:'tiempo y abandono por paso',
      body:`<table class="tbl" style="margin:-4px 0">
        <thead><tr><th>Paso</th><th class="num">Tiempo</th><th style="width:120px">Abandono</th></tr></thead>
        <tbody>${pasos.map(p=>`<tr><td>${esc(p.n)}</td><td class="num">${p.t.toFixed(2).replace('.',',')} s</td>
          <td><div class="rowmeter"><div class="meter"><i style="width:${p.ab*22}%;background:${p.sev?cssv('--serious'):cssv('--s1')}"></i></div><b>${p.ab.toFixed(1).replace('.',',')}%</b></div></td></tr>`).join('')}
        </tbody></table>
        <p class="note" style="margin-top:10px">El paso «Validar al beneficiario» abandona más de lo normal por las esperas agotadas del directorio (${INCIDENTES[1].id}).</p>`})}

    ${(()=>{const b=chartBox(); chHBars(b.id,{items:causasRec,lw:190,vw:56,bh:20,gap:8});
      return panel({cls:'c6',t:'Motivos de reclamo', sub:'en palabras del usuario',
        body:b.html+`<p class="note" style="margin-top:10px">Dos de los cinco motivos principales se explican por los incidentes abiertos. Resolverlos reduciría la carga de Atención al Cliente en torno al 23 %.</p>`});})()}

    ${panel({cls:'c6',t:'Atención de reclamos', sub:'cumplimiento del plazo comprometido',
      body:`<div class="stat2">
        <div><span class="k">Abiertos</span><span class="v">${N(suma(reclam))}</span></div>
        <div><span class="k">Resueltos hoy</span><span class="v">${N(Math.round(suma(reclam)*0.86))}</span></div>
        <div><span class="k">Plazo comprometido</span><span class="v">7 días</span></div>
        <div><span class="k">Tiempo medio</span><span class="v">2,4 días</span></div>
      </div>
      <div class="rowmeter" style="margin-top:14px"><div class="meter" style="height:8px"><i style="width:94%;background:${cssv('--good')}"></i></div><b>94%</b></div>
      <p class="note" style="margin-top:8px">Reclamos resueltos dentro del plazo comprometido. El 6 % restante corresponde a casos que requieren confirmación de la entidad emisora.</p>`})}
  </div>`;
}
</script>

<script>
/* -------------------------- 14. VISTA ALERTAS -------------------------- */

  </div>
  <div class="grid">
    ${panel({cls:'c12',t:'Alertas abiertas', sub:sinAtender.length+' sin reconocer', flush:true,
      rt:`<button class="btn sm" onclick="reconocerTodas()">Reconocer todas</button>`,

        <div class="body">
          <div class="ttl">${esc(a.ttl)}</div>
          <div class="meta"><span class="mono">${a.id}</span><span class="mono">${esc(a.op)}</span>

      <text x="${x}" y="${y+8}" text-anchor="middle" font-size="10" fill="${cssv('--ink-3')}" font-family="var(--mono)">uso ${carga[k]} %</text>

  const idMapa='mapa'+(++CHID);
  PEND.push(()=>{
    document.querySelectorAll('#'+idMapa+' .nodo').forEach(n=>
      n.addEventListener('click',()=>abrirNodo(n.dataset.n)));

  const filaEnt = ENTIDADES.map(e=>`<tr class="clickable" onclick="abrirEntidad('${e.id}')">

        <p class="note" style="margin-top:6px">El grosor de la línea representa el caudal de operaciones. El color marca la salud del componente de destino. Dos componentes están fuera de rango: el core de la entidad emisora (96 % de uso) y el directorio de alias (91 %).</p>`})}
